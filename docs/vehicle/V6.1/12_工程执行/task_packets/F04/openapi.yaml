components:
  schemas:
    LicenseReview:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
        plateNo:
          type: string
        ownerName:
          type: string
        vin:
          type: string
        registerDate:
          type: string
        useType:
          type: string
        mainFileId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        subFileId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reviewComment:
          type: string
      additionalProperties: false
      required:
      - expectedVersion
      - plateNo
      - ownerName
      - vin
      - registerDate
      - useType
      - mainFileId
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_BINDING_CREDENTIAL_INVALID
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    License:
      type: object
      properties:
        reviewStatus:
          $ref: '#/components/schemas/LicenseReviewStatus'
        plateNo:
          type: string
        ownerNameMask:
          type: string
        vinLast4:
          type: string
        ocrTaskId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        confidence:
          type: object
          additionalProperties:
            type: number
        version:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
      additionalProperties: false
    LicenseReviewStatus:
      type: string
      enum:
      - MISSING
      - PENDING
      - VERIFIED
  responses:
    UnprocessableEntity:
      description: 填写内容不符合要求。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 422
            errorCode: VI_DATA_INVALID
            msg: 填写内容不符合要求
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Conflict:
      description: 记录已变化，请刷新后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 409
            errorCode: VI_VERSION_CONFLICT
            msg: 记录已变化，请刷新后重试
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    NotFound:
      description: 记录不存在或不可访问。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 404
            errorCode: VI_RESOURCE_NOT_VISIBLE
            msg: 记录不存在或不可访问
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: VI_INTERNAL_ERROR
            msg: 处理失败，请联系服务人员
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    TooManyRequests:
      description: 操作过于频繁，请稍后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 429
            errorCode: VI_RATE_LIMITED
            msg: 操作过于频繁，请稍后重试
            requestId: req-example
            retryable: true
            retryAfterSeconds: 10
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    Forbidden:
      description: 没有执行此操作的权限。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 403
            errorCode: VI_FORBIDDEN
            msg: 没有执行此操作的权限
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unauthorized:
      description: 登录已失效，请重新登录。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 401
            errorCode: VI_AUTH_REQUIRED
            msg: 登录已失效，请重新登录
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="mini" 或 "admin"；不泄露令牌细节
    BadRequest:
      description: 请求格式不正确。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 400
            errorCode: VI_REQUEST_INVALID
            msg: 请求格式不正确
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
  securitySchemes:
    MiniBearerAuth:
      type: http
      scheme: bearer
      description: 小程序不透明随机访问令牌；数据库权威会话，非sys_user JWT；见T3.1
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 现有xinyi后台sys_user会话，不能作为小程序车主/代驾身份
