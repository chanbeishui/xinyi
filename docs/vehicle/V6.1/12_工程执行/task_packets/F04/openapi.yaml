      description: '流程：F15。复用同一应用服务；当前会话角色及授权站点∩真实订单归属验证；站点收车/放车走统一交接confirm，不另造绕过接口

        参数校验、真实归属、服务端当前状态/版本先于写入；不接受主体伪造。'
      x-flow-ids:
