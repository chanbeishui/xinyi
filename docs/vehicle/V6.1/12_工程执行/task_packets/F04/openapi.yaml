openapi: 3.0.3
info:
  title: 行驶证OCR和人工复核
  version: 6.0.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/app/station/orders/{orderNo}/license:
    get:
      operationId: API_074_get
      summary: 行驶证复核状态
      tags:
      - STATION
      description: '流程：F15。复用同一应用服务；当前会话角色及授权站点∩真实订单归属验证；站点收车/放车走统一交接confirm，不另造绕过接口

        参数校验、真实归属、服务端当前状态/版本先于写入；不接受主体伪造。'
      x-flow-ids:
      - F15
      security:
      - MiniBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/License'
                    nullable: true
                    type: object
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      x-permission: biz:license:list
      x-authorization:
        realm: MINI
        scope: ORG_DEPT_STATION
        permission: biz:license:list
        activeRole: STATION
        miniActionAllowlist: true
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: OBJECT_404_HIDES_EXISTENCE
      x-contract-baseline: V6.0
    put:
      operationId: API_075_put
      summary: 登记并复核行驶证
      tags:
      - STATION
      description: '流程：F15。复用同一应用服务；当前会话角色及授权站点∩真实订单归属验证；站点收车/放车走统一交接confirm，不另造绕过接口

        参数校验、真实归属、服务端当前状态/版本先于写入；不接受主体伪造。'
      x-flow-ids:
      - F15
      security:
      - MiniBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/License'
                    nullable: true
                    type: object
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: UUID；按主体+动作+资源+键及请求摘要保存首次结果；同键不同体409，至少24h，资金/交接另有永久业务去重
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseReview'
      x-permission: biz:license:edit
      x-authorization:
        realm: MINI
        scope: ORG_DEPT_STATION
        permission: biz:license:edit
        activeRole: STATION
        miniActionAllowlist: true
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_IDEMPOTENCY_CONFLICT
      - VI_SELECTION_CONFLICT
      - VI_CONTEXT_CHANGED
      - VI_SNAPSHOT_CHANGED
      - VI_DATA_INVALID
      - VI_EVIDENCE_INCOMPLETE
      - VI_HANDOVER_CODE_INVALID
      - VI_HANDOVER_LOCKED
      - VI_UNPRICED_LINES
      - VI_REFUND_LIMIT
      - VI_PAYMENT_LIMIT
      - VI_SERVICE_UNAVAILABLE
      - VI_CAPABILITY_NOT_CONFIGURED
      - VI_TRAINING_NOT_READY
      - VI_BINDING_CREDENTIAL_INVALID
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: OBJECT_404_HIDES_EXISTENCE
      x-contract-baseline: V6.0
  /api/admin/orders/{orderNo}/license:
    get:
      operationId: API_085_get
      summary: 行驶证复核状态
      tags:
