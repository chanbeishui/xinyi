openapi: 3.0.3
info:
  title: 发布快照与本人确认差异
  version: 6.0.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/app/driver/statements:
    get:
      operationId: V4_get_api_app_driver_statements
      summary: 对账单列表
      tags:
      - DRIVER
      security:
      - MiniBearerAuth: []
      x-flow-ids:
      - F32
      description: 仅取当前有效发布快照或历史已确认快照；禁止查询内部DRAFT/INTERNAL_REVIEW；已撤回返回明确不可确认。
      parameters:
      - name: pageNum
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: keyword
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
          description: 白名单字段，不允许原样SQL拼接
      responses:
        '200':
          description: 成功，返回当前业务事实
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/DriverStatementPublic'
                  total:
                    type: integer
                    minimum: 0
                required:
                - code
                - msg
                - rows
                - total
                description: ''
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-capability: DRIVER_DRIVERSTATEMENT_LIST
      x-authorization:
        realm: MINI
        scope: OWN_DRIVER_RECORD
        capability: DRIVER_DRIVERSTATEMENT_LIST
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.0
      x-public-projection: DriverStatementPublic or publicly limited payment/service
        view only
  /api/app/driver/statements/{statementId}:
    get:
      operationId: V4_get_api_app_driver_statements__statementId
      summary: 查看对账单与快照
      tags:
      - DRIVER
      security:
      - MiniBearerAuth: []
      x-flow-ids:
      - F32
      description: 仅取当前有效发布快照或历史已确认快照；禁止查询内部DRAFT/INTERNAL_REVIEW；已撤回返回明确不可确认。
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      responses:
        '200':
          description: 成功，返回当前业务事实
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/DriverStatementPublic'
                required:
                - code
                - msg
                - data
                description: ''
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      x-capability: DRIVER_DRIVERSTATEMENT_QUERY
      x-authorization:
        realm: MINI
        scope: OWN_DRIVER_RECORD
        capability: DRIVER_DRIVERSTATEMENT_QUERY
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: OBJECT_404_HIDES_EXISTENCE
      x-contract-baseline: V6.0
      x-public-projection: DriverStatementPublic or publicly limited payment/service
        view only
  /api/admin/driver-statements/{statementId}/send:
    post:
      operationId: V4_post_api_admin_driver_statements__statementId__send
      summary: 发给代驾确认
      tags:
      - ADMIN
      security:
      - AdminBearerAuth: []
      x-flow-ids:
      - F32
      description: 无人工填价/改价，或有同内容版本有效复核，才允许发送；有人工修改的通常路径使用review批准并发送。禁止未核价或待复核绕过。通知通过outbox异步，不伪称已读。
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: UUID；同主体+动作+资源+键，同体重放，不同体409；领域唯一性额外永久去重
      responses:
        '200':
          description: 成功，返回当前业务事实
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/DriverStatement'
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementRevisionAction'
      x-permission: biz:driverstatement:send
      x-authorization:
        realm: ADMIN
        scope: ORG_DEPT_STATION_AND_PAYOR
        permission: biz:driverstatement:send
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_IDEMPOTENCY_CONFLICT
      - VI_SELECTION_CONFLICT
      - VI_CONTEXT_CHANGED
      - VI_SNAPSHOT_CHANGED
      - VI_DATA_INVALID
      - VI_EVIDENCE_INCOMPLETE
      - VI_HANDOVER_CODE_INVALID
      - VI_HANDOVER_LOCKED
      - VI_UNPRICED_LINES
      - VI_REFUND_LIMIT
      - VI_PAYMENT_LIMIT
      - VI_SERVICE_UNAVAILABLE
      - VI_CAPABILITY_NOT_CONFIGURED
      - VI_TRAINING_NOT_READY
      - VI_BINDING_CREDENTIAL_INVALID
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
