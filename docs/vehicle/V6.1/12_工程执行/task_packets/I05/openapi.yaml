            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    NotFound:
      description: 记录不存在或不可访问。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 404
            errorCode: VI_RESOURCE_NOT_VISIBLE
            msg: 记录不存在或不可访问
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
