          location:
            lng: 110.123456
            lat: 22.123456
            coordinateSystem: GCJ02
          servicePhone: null
        slotStartAt: '2026-10-20T06:00:00.000Z'
        slotEndAt: '2026-10-20T07:00:00.000Z'
        returnedAt: null
        version: 0
        view: DRIVER
        assignmentId: '300'
        assignmentEndedAt: null
        accessPhase: ACTIVE_ASSIGNMENT
        pickupArea: 示例区域
        pickupAddress:
          address: 示例上门地址
          location:
            lng: 110.123456
            lat: 22.123456
            coordinateSystem: GCJ02
          contact:
            displayName: 车主称谓
            phoneMask: 138****0000
            canRequestContact: true
        returnAddress:
          address: 示例上门地址
          location:
            lng: 110.123456
            lat: 22.123456
            coordinateSystem: GCJ02
          contact:
            displayName: 车主称谓
            phoneMask: 138****0000
            canRequestContact: true
        ownerContact:
          displayName: 车主称谓
          phoneMask: 138****0000
          canRequestContact: true
        mileage:
          pickupKm: null
          returnKm: null
          distanceKm: null
          abnormal: false
          publicExplanation: null
        cancellation:
          returnRequired: false
          displayStatus: 正常履约
          publicInstruction: null
        driverReleased: false
        allowedActions:
        - DEPART
