      - name
      - publicAddress
      - location
      - servicePhone
    OrderVehicleView:
      type: object
      additionalProperties: false
      properties:
        vehicleId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
