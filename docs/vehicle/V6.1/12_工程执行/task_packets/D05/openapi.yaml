components:
  schemas:
    OrderContactRequest:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          enum:
          - OWNER
          - DRIVER
          - STATION
        purpose:
          type: string
          minLength: 1
          maxLength: 200
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
      required:
      - target
      - purpose
      - expectedVersion
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_BINDING_CREDENTIAL_INVALID
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    OrderContactAccess:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - VIRTUAL_NUMBER
          - SERVICE_NUMBER
        dialNumber:
          type: string
          description: 受控可拨号码；默认不提供未获批准的真实个人手机号
        expiresAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
        auditRef:
          type: string
      required:
      - mode
      - dialNumber
      - expiresAt
      - auditRef
    ActionRequest:
      type: object
      properties:
        assignmentId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        expectedVersion:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
        location:
          $ref: '#/components/schemas/Location'
        reason:
          type: string
      additionalProperties: false
      required:
      - assignmentId
      - expectedVersion
      - location
    Location:
      type: object
      properties:
        lng:
          type: number
          minimum: -180
          maximum: 180
        lat:
          type: number
          minimum: -90
          maximum: 90
        accuracyMeter:
          type: integer
          minimum: 0
        capturedAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
        coordinateSystem:
          type: string
          enum:
          - GCJ02
      additionalProperties: false
      required:
      - lng
      - lat
      - capturedAt
      - coordinateSystem
    DriverOrderView:
      type: object
      additionalProperties: false
      properties:
        orderNo:
          type: string
        fulfillmentStatus:
          $ref: '#/components/schemas/FulfillmentStatus'
        displayStatus:
          type: string
        cancelStatus:
          $ref: '#/components/schemas/CancelStatus'
        custody:
          $ref: '#/components/schemas/CustodyType'
        vehicle:
          $ref: '#/components/schemas/OrderVehicleView'
        station:
          $ref: '#/components/schemas/OrderStationView'
        slotStartAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
        slotEndAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
        returnedAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
          nullable: true
        version:
          type: integer
          format: int64
