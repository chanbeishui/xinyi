            schema:
              $ref: '#/components/schemas/OrderContactRequest'
      x-capability: COMMON_ORDERS_CONTACTACCESS
      security:
      - MiniBearerAuth: []
      - AdminBearerAuth: []
      x-authorization:
        anyOf:
        - realm: MINI
          scope: SESSION_OR_EXPLICIT_OBJECT_POLICY
          capability: COMMON_ORDERS_CONTACTACCESS
        - realm: ADMIN
          permission: biz:order:contact
          scope: ORG_DEPT_STATION_AND_PURPOSE
      x-error-codes:
      - VI_REQUEST_INVALID
