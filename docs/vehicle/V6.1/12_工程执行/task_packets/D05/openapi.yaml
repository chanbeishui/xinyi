      - UPLOAD_PHOTO
      - FILL_MILEAGE
      - REPORT_EXCEPTION
      - VIEW_DETAIL
      - VIEW_RESULT
      - VIEW_EVIDENCE
      - VIEW_HANDOVER_SECRET
