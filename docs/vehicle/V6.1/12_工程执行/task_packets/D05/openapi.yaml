  /api/common/orders/{orderNo}/contact-access:
    post:
      summary: 按履约及当前视角获取短期联系通道
      description: 按履约及当前视角获取短期联系通道。真实主体由认证上下文构造；不得信任客户端通过/授权结论。
      operationId: v5_post_api_common_orders_orderNo_contact_access
      parameters:
      - in: path
        name: orderNo
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/OrderContactAccess'
                required:
