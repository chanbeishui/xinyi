      - slotEndAt
      - returnedAt
      - version
      - view
      - assignmentId
      - assignmentEndedAt
      - accessPhase
      - pickupArea
      - pickupAddress
      - returnAddress
      - ownerContact
      - mileage
      - cancellation
      - driverReleased
      - allowedActions
      description: Driver明确字段白名单。没有定义的字段必须省略；nullable字段明确返回null；每次响应包括嵌套字段均按服务端权限和业务阶段投影，不能直接序列化Order实体。
      example:
        orderNo: VI202610200001
        fulfillmentStatus: ACCEPTED
        displayStatus: 代驾已接单
        cancelStatus: NONE
        custody: OWNER
        vehicle:
          vehicleId: '100'
