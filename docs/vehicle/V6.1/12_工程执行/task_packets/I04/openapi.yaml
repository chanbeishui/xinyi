      - DRIVER_PENALTY_CREATE
      - DRIVER_PENALTY_LIST
      - DRIVER_PENALTY_QUERY
      - DRIVER_QUALIFICATION_ATTEMPTS
      - DRIVER_QUALIFICATION_CREATE
      - DRIVER_QUALIFICATION_EDIT
      - DRIVER_QUALIFICATION_LIST
      - DRIVER_QUALIFICATION_PLAYBACK
      - DRIVER_QUALIFICATION_PROGRESS
      - DRIVER_QUALIFICATION_QUERY
      - DRIVER_QUALIFICATION_SUBMIT
      - EMPLOYEE_BINDING_CONSUME
