components:
  schemas:
    AccessRequest:
      type: object
      properties:
        purpose:
          type: string
        orderNo:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
        fields:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - purpose
      description: 理由不是自动授权，仍须权限/审批；短期访问且留痕
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_BINDING_CREDENTIAL_INVALID
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    AccessResult:
      type: object
      properties:
        requestId:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        expiresAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
        downloadUrl:
          type: string
      additionalProperties: false
    FileReady:
      type: object
      properties:
        fileId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        status:
          $ref: '#/components/schemas/FileStatus'
        serverSha256:
          type: string
        size:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
      additionalProperties: false
    FileStatus:
      type: string
      enum:
      - UPLOADING
      - VERIFYING
      - READY
      - REJECTED
    UploadRequest:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - VEHICLE_PHOTO
          - ID_CARD
          - DRIVER_LICENSE
          - VEHICLE_LICENSE
          - RESULT_EVIDENCE
          - DISPUTE
          - STATION_QUALIFICATION
          - AVATAR
        orderNo:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
        applicationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        fileName:
          type: string
        mimeType:
          type: string
          enum:
          - image/jpeg
          - image/png
        size:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - purpose
      - fileName
      - mimeType
      - size
      description: 订单与申请归属校验；不能只有任意ossKey和客户端哈希；允许文件类型以原业务范围评审
    UploadTicket:
      type: object
      properties:
        uploadId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        fileId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        uploadUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
      required:
      - uploadId
      - fileId
      - uploadUrl
      - expiresAt
  responses:
    UnprocessableEntity:
      description: 填写内容不符合要求。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 422
            errorCode: VI_DATA_INVALID
            msg: 填写内容不符合要求
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Conflict:
