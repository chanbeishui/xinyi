      description: '流程：F15。复用同一应用服务；当前会话角色及授权站点∩真实订单归属验证；站点收车/放车走统一交接confirm，不另造绕过接口

        参数校验、真实归属、服务端当前状态/版本先于写入；不接受主体伪造。'
      x-flow-ids:
      - F15
      security:
      - AdminBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/AdminOrderView'
                    nullable: true
                    type: object
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      x-permission: biz:order:query
      x-authorization:
        realm: ADMIN
        scope: ORG_DEPT_STATION
        permission: biz:order:query
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: OBJECT_404_HIDES_EXISTENCE
      x-contract-baseline: V6.0
components:
  responses:
    NotFound:
      description: 记录不存在或不可访问。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 404
            errorCode: VI_RESOURCE_NOT_VISIBLE
            msg: 记录不存在或不可访问
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: VI_INTERNAL_ERROR
            msg: 处理失败，请联系服务人员
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    TooManyRequests:
      description: 操作过于频繁，请稍后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 429
            errorCode: VI_RATE_LIMITED
            msg: 操作过于频繁，请稍后重试
            requestId: req-example
            retryable: true
            retryAfterSeconds: 10
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    Forbidden:
      description: 没有执行此操作的权限。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 403
            errorCode: VI_FORBIDDEN
            msg: 没有执行此操作的权限
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unauthorized:
      description: 登录已失效，请重新登录。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 401
            errorCode: VI_AUTH_REQUIRED
            msg: 登录已失效，请重新登录
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="mini" 或 "admin"；不泄露令牌细节
    BadRequest:
      description: 请求格式不正确。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 400
            errorCode: VI_REQUEST_INVALID
            msg: 请求格式不正确
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_BINDING_CREDENTIAL_INVALID
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
