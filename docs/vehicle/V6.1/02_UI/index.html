function ico(name, size){
  var d = ICONS[name];
  if(!d){ d = ICONS.empty; }
  var s = size || 22;
  var w = s < 12 ? 2.4 : (s < 16 ? 2.1 : 1.8);
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto">'+d+'</svg>';
}
function icoc(name, size, color){
  return '<span style="color:'+(color||'currentColor')+';display:inline-flex">'+ico(name,size)+'</span>';
}

<script>
(function(U){'use strict';const R=U.desktopPages={};const{panel:p,button:b,goBtn:g,kv,notice:n,field:f,check:c,row,icon,badge:tag,table:t}=U;
const toolbar=(...xs)=>`<div class="flex">${xs.join('')}</div>`;
const grid=(a,b,equal=false)=>`<div class="pc-grid ${equal?'equal':''}"><div class="stack">${a}</div><div class="stack">${b}</div></div>`;
const screen=(title,desc,body,actions='',overlay='')=>({title,desc,body,actions,overlay});
const cardTable=(title,headers,rows,key,filters=true,actions='')=>{let q=String(U.store.saved['filter:'+key]||'').toLowerCase(),status=U.store.saved['status:'+key]||'全部';rows=rows.filter(r=>{const text=r.map(x=>String(x).replace(/<[^>]*>/g,' ')).join(' ').toLowerCase();return (!q||text.includes(q))&&(status==='全部'||text.includes(status.toLowerCase()));});return `<section class="panel"><header class="panel-head"><h3>${title}</h3>${actions}</header>${filters?U.filters(key):''}${t(headers,rows)}${U.pager(rows.length,key)}</section>`;};
function orderRows(key='orders'){let rows=U.filterRows(key,U.seeds.orders);const stat=U.store.saved['status:'+key];if(stat&&stat!=='全部')rows=rows.filter(x=>(stat==='待处理'?['MANUAL_DISPATCH','PENDING_PAY','INSPECTING'].includes(x.stage):stat==='处理中'?['CAR_TAKEN','INSPECTING','SCHEDULED'].includes(x.stage):['WAIT_CONFIRM','COMPLETED'].includes(x.stage)));return rows;}
function orderTable(key='orders',state='default'){if(['empty','error','loading','forbidden'].includes(state))return state==='loading'?'<div class="panel-body"><div class="skeleton big"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>':U.empty(state==='forbidden'?'暂无此范围的订单权限':state==='empty'?'未找到匹配的预约订单':'订单加载失败',state==='forbidden'?'请切换到获授权的数据范围或联系管理员。':'保留筛选条件，可修改条件或重新加载。',g('返回订单列表','B03','secondary'),state==='forbidden'?'lock':'search');const rows=orderRows(key);return rows.length?t(['订单 / 车辆','上门时段','检测点','当前保管方','履约状态','取消 / 资金','操作'],rows.map(o=>[`<div class="primary">${o.plate}</div><small class="mono">${o.no}</small>`,o.slot,o.station,o.custody,tag(U.stageLabels[o.stage],o.stage==='WAIT_CONFIRM'?'green':o.stage==='MANUAL_DISPATCH'?'orange':''),`${tag(o.cancel,o.cancel==='无申请'?'gray':'orange')}<small>${o.pay} · ${U.money(o.amount)}</small>`,g('详情','B04','link')]))+U.pager(rows.length,key):U.empty('未找到匹配订单','请修改筛选条件。',b('重置筛选','reset-filter','secondary',{payload:key}));}
const licenseFields=()=>f('车牌号码','license.plate',U.demoOrder.plate,'text',{required:true})+f('完整VIN','license.vin','','text',{required:true,placeholder:'对照证件填写虚构测试数据'})+f('证件登记姓名','license.owner','','text',{required:true})+f('注册日期','license.date','','date',{required:true})+f('使用性质','license.use','非营运','select',{options:['非营运','营运','其他'],required:true})+f('品牌型号','license.model','本田牌（演示）','text');
R.B01=()=>({login:true,title:'后台登录',body:`<div class="pc-login-left"><div><div class="brand-symbol">检</div><b>集信车检 · 运营管理</b></div><div><h1>把每一次交接<br>都管理清楚。</h1><div class="line"></div><p>预约、派单、检测结果、取消返还与资金追溯。</p></div><small>PRD V2.1-R3 · 本页面复用既有框架登录设计</small></div><div class="pc-login-form"><h2>登录管理后台</h2><p>使用现有框架账号与权限范围</p>${f('账号','admin.username','','text',{required:true,placeholder:'输入演示账号'})}${f('密码','admin.password','','password',{required:true,placeholder:'请勿输入真实生产密码'})}${c('我了解这是离线演示环境','admin.demoConfirm',false)}${b('登录后台原型','admin-login','block',{require:'admin.username,admin.password,admin.demoConfirm'})}<p class="hint mt">不会连接实际账号服务，不会向外发送密码。正式登录方式以仓库已接入能力为准。</p></div>`});
R.B02=()=>screen('运营工作台','先处理待返还车辆和人工待办，再关注当日业务概况。',`<div class="metrics">${U.metric('预约总量','6','当前演示数据范围')}${U.metric('取消待审核','1','审批前重读当前保管方')}${U.metric('批准待返还','1','仍有车辆保管责任')}${U.metric('待人工安排','1','需要邀约合格司机')}</div>`+grid(p('需要优先处理',row('key','取消已批准，车辆等待返还','粤K·5M9Q7 · 当前由代驾保管',g('跟踪返还','B29-wait-return','small'))+row('clock','取消申请等待审核','粤K·8H3T2 · 车辆在城东检测站',g('去审核','B29-review','secondary small'))+row('steering','订单需要人工安排','粤K·1R8V3 · 自动派单无可用承接',g('打开调度','B05','secondary small'))),p('当前保管分布',`<div class="bar-row"><span>车主保管</span><div class="progressline"><i style="width:67%"></i></div><b>4</b></div><div class="bar-row"><span>代驾保管</span><div class="progressline"><i style="width:17%"></i></div><b>1</b></div><div class="bar-row"><span>检测点保管</span><div class="progressline"><i style="width:17%"></i></div><b>1</b></div><p class="hint">来源：当前6条演示订单，含预约前与已归还状态。</p>`))+`<section class="panel"><header class="panel-head"><h3>近期预约</h3>${g('查看全部','B03','link')}</header>${orderTable()}</section>`,g('查看待返还车辆','B29-wait-return','',{icon:'key'}));

<script>
(function(U){'use strict';const prev=U.action, go=id=>U.go(id), val=k=>String(U.get(k,'')).trim();

U.action=async function(action,payload='',element=null){const z=U.v5();
 if(action==='training-demo'){go('D39');return;}
 if(action==='appeal'){go('D43');return;}
 if(action==='v5-open-face'){go('D46');return;}

 if(action==='v5-appeal-submit'){if(z.appeal){go('D44');return;}if(!need(['v5.appealReason']))return;z.appeal={id:'APPEAL-DEMO-001',reason:val('v5.appealReason')};go('D44');return;}
 if(action==='v5-appeal-approve'||action==='v5-appeal-reject'){if(z.appealDecision){U.toast('本申诉已处理');return;}if(!need(['v5.appealOpinion']))return;z.appealDecision=action==='v5-appeal-approve'?'APPROVE':'REJECT';z.appealOpinion=val('v5.appealOpinion');U.toast('演示处理已保存');U.testing.render('B45');return;}
 if(action==='v5-face-start'){z.faceStatus='PENDING';U.toast('已创建演示会话，未调用供应商');U.testing.render('D46');return;}
 if(action==='v5-face-query'){if(z.faceStatus!=='PENDING')return;z.faceStatus='DEMO_PASSED';U.store.saved.face=true;U.toast('这是模拟结果，不是实际人脸核验');U.testing.render('D46');return;}

 if(action==='v5-bind-issue'){if(!need(['v5.sysUser','v5.issueReason','v5.identityChecked']))return;if(z.bindingConsumed){U.toast('已消费的请求不能再签发');return;}z.bindingRequest=z.bindingRequest||{requestCode:'BIND-DEMO-001',reason:'演示申请'};z.bindingIssued=true;U.toast('仅签发凭证，尚未绑定成功');U.testing.render('B36');return;}

 if(action==='v5-course-save'||action==='v5-course-publish'){if(!need(['v5.courseTitle','v5.mediaFileId','v5.duration','v5.passScore','v5.examSeconds','v5.prompt','v5.optionA','v5.optionB','v5.correct']))return;let score=Number(val('v5.passScore')),duration=Number(val('v5.duration'));if(score<0||score>100||!Number.isFinite(score)||duration<1){U.toast('请检查分数和必学时长');return;}z.coursePublished=action==='v5-course-publish';U.toast(z.coursePublished?'演示课程版本已发布':'演示课程草稿已保存');go('B43');return;}
 return prev(action,payload,element);
};
