<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="2030" viewBox="0 0 1260 2030" role="img" aria-labelledby="title desc">
<title id="title">F49 · 代驾资格申请、补正与复审</title>
<desc id="desc">本人草稿、真实证件、有效公司及当前材料五项正式证明全部通过后才提交。审批与真实培训核验为后续任务；复审不覆盖生效资格，不解除在手责任。</desc>
