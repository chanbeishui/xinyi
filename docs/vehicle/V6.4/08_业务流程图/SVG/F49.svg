<text x="1216" y="1190" class="edge-label" transform="rotate(-90 1216 1190)">另建复审：原生效资格与在手责任保持独立</text>
<g id="n1"><rect x="410" y="100" width="520" height="72" rx="12" fill="#ffffff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="129.5" text-anchor="middle" class="node-title">已核验手机号的本人进入</text>
<text x="670.0" y="154.5" text-anchor="middle" class="node-body">OWNER / STATION / DRIVER均可申请</text>
</g>
<g id="n2"><rect x="410" y="210" width="520" height="82" rx="12" fill="#ffffff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="244.5" text-anchor="middle" class="node-title">阅读并明确同意现行资格说明</text>
<text x="670.0" y="269.5" text-anchor="middle" class="node-body">绑定consentVersion + 公开原文hash</text>
</g>
<g id="n3"><rect x="410" y="334" width="520" height="104" rx="12" fill="#ffffff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="367.0" text-anchor="middle" class="node-title">建立本人资格草稿</text>
<text x="670.0" y="392.0" text-anchor="middle" class="node-body">首次未归属、禁新；公司不从员工或主部门猜测</text>
<text x="670.0" y="417.0" text-anchor="middle" class="node-body">复审另建申请，生效档案保持独立</text>
</g>
<g id="n4"><rect x="410" y="486" width="520" height="100" rx="12" fill="#ffffff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="517.0" text-anchor="middle" class="node-title">本人私有上传证件与保存资料</text>
<text x="670.0" y="542.0" text-anchor="middle" class="node-body">四证件须同申请、本人、READY、用途正确</text>
<text x="670.0" y="567.0" text-anchor="middle" class="node-body">四ID各异；省略保留，null明确清除</text>
</g>
<g id="n5"><rect x="410" y="634" width="520" height="90" rx="12" fill="#ffffff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="660.0" text-anchor="middle" class="node-title">材料实际变更：revision + HMAC更新</text>
<text x="670.0" y="685.0" text-anchor="middle" class="node-body">旧材料证明失效，不复用PASSED</text>
<text x="670.0" y="710.0" text-anchor="middle" class="node-body">仅更新同意不改材料版本</text>
</g>
<g id="n6"><rect x="45" y="634" width="290" height="124" rx="12" fill="#ffffff" stroke="#a8bfdc" stroke-width="2"/>
<text x="190.0" y="664.5" text-anchor="middle" class="node-title">后台 A04 明确认领公司</text>
<text x="190.0" y="689.5" text-anchor="middle" class="node-body">必须为实际有效公司部门</text>
<text x="190.0" y="714.5" text-anchor="middle" class="node-body">提交冻结真实公司快照</text>
<text x="190.0" y="739.5" text-anchor="middle" class="node-body">MINI不能指定公司</text>
</g>
<g id="n7"><rect x="410" y="772" width="520" height="110" rx="12" fill="#edf4ff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="795.5" text-anchor="middle" class="node-title">真实核验与培训（Q03/Q04）</text>
<text x="670.0" y="820.5" text-anchor="middle" class="node-body">REALNAME · FACE · BACKGROUND</text>
<text x="670.0" y="845.5" text-anchor="middle" class="node-body">LICENSE · TRAINING正式汇总证明</text>
<text x="670.0" y="870.5" text-anchor="middle" class="node-body">当前材料、PASSED、可信核验时刻</text>
</g>
<g id="n9"><rect x="35" y="944" width="280" height="136" rx="12" fill="#fff7e8" stroke="#d7a34b" stroke-width="2"/>
<text x="175.0" y="980.5" text-anchor="middle" class="node-title">保留草稿，显示具体阻断</text>
<text x="175.0" y="1005.5" text-anchor="middle" class="node-body">缺资料 / 公司 / 现行同意</text>
<text x="175.0" y="1030.5" text-anchor="middle" class="node-body">核验或培训未接入不通过</text>
<text x="175.0" y="1055.5" text-anchor="middle" class="node-body">补齐后重新核对</text>
</g>
<g id="n10"><rect x="410" y="1134" width="520" height="110" rx="12" fill="#ffffff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="1157.5" text-anchor="middle" class="node-title">同事务校验并冻结提交快照</text>
<text x="670.0" y="1182.5" text-anchor="middle" class="node-body">applicationId + 申请及档案expectedVersion</text>
<text x="670.0" y="1207.5" text-anchor="middle" class="node-body">公司、材料、同意原文、五项证明和加密原因</text>
<text x="670.0" y="1232.5" text-anchor="middle" class="node-body">任一冲突整笔拒绝，不覆盖或部分保存</text>
</g>
<g id="n11"><rect x="410" y="1304" width="520" height="90" rx="12" fill="#ffffff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="1330.0" text-anchor="middle" class="node-title">SUBMITTED：只读等待审核</text>
<text x="670.0" y="1355.0" text-anchor="middle" class="node-body">证件写入冻结；本人可查看真实进度</text>
<text x="670.0" y="1380.0" text-anchor="middle" class="node-body">提交不授DRIVER，也不代表可以接新单</text>
</g>
<g id="n13"><rect x="35" y="1450" width="280" height="148" rx="12" fill="#fff7e8" stroke="#d7a34b" stroke-width="2"/>
<text x="175.0" y="1480.0" text-anchor="middle" class="node-title">REJECTED：仅补指定字段</text>
<text x="175.0" y="1505.0" text-anchor="middle" class="node-body">公开意见与内部意见分开</text>
<text x="175.0" y="1530.0" text-anchor="middle" class="node-body">保存仍REJECTED，不绕限制</text>
<text x="175.0" y="1555.0" text-anchor="middle" class="node-body">历史缺字段结构先人工补齐</text>
<text x="175.0" y="1580.0" text-anchor="middle" class="node-body">修改材料后重新核验</text>
</g>
<g id="n14"><rect x="410" y="1636" width="520" height="100" rx="12" fill="#edf4ff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="1667.0" text-anchor="middle" class="node-title">APPROVED：按权威生效快照刷新身份</text>
<text x="670.0" y="1692.0" text-anchor="middle" class="node-body">Q05后续独立审批，禁止本人审批</text>
<text x="670.0" y="1717.0" text-anchor="middle" class="node-body">新单另查行政开关、听单、定位及其它条件</text>
</g>
<g id="n15"><rect x="410" y="1790" width="520" height="108" rx="12" fill="#ffffff" stroke="#a8bfdc" stroke-width="2"/>
<text x="670.0" y="1825.0" text-anchor="middle" class="node-title">APPROVED / EXPIRED / SUSPENDED可另建复审</text>
<text x="670.0" y="1850.0" text-anchor="middle" class="node-body">草稿、待审、驳回不覆盖已有生效资格</text>
<text x="670.0" y="1875.0" text-anchor="middle" class="node-body">到期停新不解除承接、车辆保管或归还责任</text>
</g>
<g id="n8"><path d="M670,928.0 L955.0,1008 L670,1088.0 L385.0,1008 Z" fill="#eaf4ee" stroke="#71a587" stroke-width="2"/>
<text x="670" y="990.0" text-anchor="middle" class="node-title">完整资料 + 有效公司 + 现行同意</text>
<text x="670" y="1014.0" text-anchor="middle" class="node-body">五项当前材料可信PASSED</text>
<text x="670" y="1038.0" text-anchor="middle" class="node-body">全部满足？</text>
</g>
<g id="n12"><path d="M670,1416.0 L950.0,1496 L670,1576.0 L390.0,1496 Z" fill="#eaf4ee" stroke="#71a587" stroke-width="2"/>
<text x="670" y="1478.0" text-anchor="middle" class="node-title">Q05 后续独立审批</text>
<text x="670" y="1502.0" text-anchor="middle" class="node-body">禁止本人审批</text>
<text x="670" y="1526.0" text-anchor="middle" class="node-body">通过 / 驳回</text>
</g>
<text x="630" y="1952" text-anchor="middle" class="note">执行边界：Q01消费正式证明，不代替真实供应商、正式培训或Q05审批；未接通能力持续阻断。</text>
<text x="630" y="1984" text-anchor="middle" class="note">五项证明须同申请 / 当前材料revision与HMAC、PASSED、verified_at非空且不为未来。</text>
