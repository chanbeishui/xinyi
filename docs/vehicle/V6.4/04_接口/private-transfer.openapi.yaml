openapi: 3.0.3
info:
  title: F01 私有存储传输适配契约
  version: V6.4-PRIVATE-FILE-20261105
  description: >-
    这是四个业务JSON接口所引用的存储传输层。只处理字节，不接受业务归属变更。
    URL由服务端生成且只允许同源；生产经HTTPS。当前适配器为独立私有磁盘，
    多实例必须使用共享持久卷或实现同等鉴权与不可覆盖约束的对象存储适配器。
    不公开映射到profile，不向客户端返回object_key；票据不放URL中。
security:
  - BearerAuth: []
    FileTicket: []
paths:
  /vi-private-transfer/uploads/{id}:
    put:
      operationId: PRIVATE_FILE_UPLOAD_BYTES
      summary: 在300秒上传窗口内传输一次原始图片字节
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/ClientType'
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, format: binary}
          image/jpeg:
            schema: {type: string, format: binary}
      responses:
        '204': {description: 已接收完整字节，必须调用complete核验才能使用}
        '400': {description: 格式不正确}
        '401': {description: 当前会话失效或跨认证域}
        '403': {description: 功能权限不足或票据失效}
        '404': {description: 文件不存在或父业务不可访问}
        '409': {description: 已上传、租约占用或状态冲突}
        '422': {description: 字节大小不匹配或超出10MiB}
  /vi-private-transfer/files/{id}:
    get:
      operationId: PRIVATE_FILE_DOWNLOAD_BYTES
      summary: 60秒读取票据与当前业务授权同时成立时读取核验过的原图
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/ClientType'
      responses:
        '200':
          description: 原始图片，Cache-Control=no-store、nosniff、attachment；实际读取重新审计
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        '401': {description: 当前会话失效或跨认证域}
        '403': {description: 功能权限不足或票据失效}
        '404': {description: 文件不存在或父业务不可访问}
        '409': {description: 尚未完成核验}
components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer}
    FileTicket: {type: apiKey, in: header, name: X-File-Ticket}
  parameters:
    FileId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
    ClientType:
      name: X-Client-Type
      in: header
      required: true
      schema: {type: string, enum: [owner, driver, station, admin]}
