# 在已配置TLS的server内include，upstream vi_backend由部署声明。
# /api前缀不剥离、不重复添加。不要把此片段当包含证书的完整站点配置。
location ^~ /api/admin/ { return 404; }
location ^~ /__integration/ { return 404; }
location ^~ /system/ { return 404; }
location ^~ /monitor/ { return 404; }
location ^~ /druid/ { return 404; }
location ^~ /swagger-ui/ { return 404; }
location ^~ /v3/api-docs { return 404; }
location ^~ /actuator/ { return 404; }
location ^~ /profile/ { return 404; }
location ^~ /api/ {
    proxy_pass http://vi_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    client_max_body_size 12m;
}
location / { return 404; }
