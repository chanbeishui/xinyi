      - APPEAL_PENALTY
      - APPLY_ADJUSTMENT
      - APPLY_CANCEL_REFUND
      - APPLY_REFUND_ONLY
      - APPROVE_AND_SEND
      - ARRIVE_PICKUP
      - ARRIVE_STATION
      - CANCEL_ASSIGNMENT
      - CLOSE_UNPAID
      - CONFIRM_HANDOVER
      - CONFIRM_STATEMENT
      - CONTACT_DRIVER
      - CONTACT_OWNER
      - CONTACT_STATION
      - CREATE_HANDOVER
      - DEPART
      - EDIT_PRICE
      - EXPORT
      - FILL_MILEAGE
      - FILL_PRICE
      - MANUAL_INVITE
      - MARK_EVIDENCE_READY
      - OPEN_DISPUTE
      - PAY
      - RECORD_PAYMENT
      - REGISTER_RESULT
      - REJECT_REVIEW
      - REMOVE_FROM_DRAFT
      - RENOTIFY_PICKUP
      - REPORT_DIFFERENCE
      - REPORT_EXCEPTION
      - REQUEST_RESULT_CORRECTION
      - REVIEW_AFTERSALE
      - REVIEW_LICENSE
      - SEND_STATEMENT
      - SERVICE_CONFIRM
      - SUBMIT_REVIEW
      - UPLOAD_PHOTO
      - VERIFY_PAYMENT
      - VIEW_APPEAL
      - VIEW_DETAIL
      - VIEW_EVIDENCE
      - VIEW_HANDOVER_SECRET
      - VIEW_PAYMENT
      - VIEW_PRICE_HISTORY
      - VIEW_PRICING
      - VIEW_RESULT
      - VOID_STATEMENT
      - WITHDRAW_STATEMENT
    AfterSaleApply:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - CANCEL_REFUND
          - REFUND_ONLY
        reasonCode:
          type: string
        reason:
          type: string
          description: 1–1000字符
        requestedAmount:
          type: integer
          format: int64
          minimum: 0
          description: 人民币分
        voucherFileIds:
          type: array
          items:
            type: string
            description: 服务端不透明主键，以字符串传输
        expectedOrderVersion:
          type: integer
          format: int64
          description: 最后读取版本，用于条件更新；409必须重新获取，不静默覆盖
      required:
      - kind
      - reason
      - requestedAmount
      - expectedOrderVersion
      description: 以当前登录车主创建一次售后请求。同订单仅一个未办结申请，其他金额仍须资金锁与预留校验。
  responses:
    UnprocessableEntity:
      description: 填写内容不符合要求。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 422
            errorCode: VI_DATA_INVALID
            msg: 填写内容不符合要求
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Conflict:
      description: 记录已变化，请刷新后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 409
            errorCode: VI_VERSION_CONFLICT
            msg: 记录已变化，请刷新后重试
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    NotFound:
      description: 记录不存在或不可访问。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 404
            errorCode: VI_RESOURCE_NOT_VISIBLE
            msg: 记录不存在或不可访问
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: VI_INTERNAL_ERROR
            msg: 处理失败，请联系服务人员
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    TooManyRequests:
      description: 操作过于频繁，请稍后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 429
            errorCode: VI_RATE_LIMITED
            msg: 操作过于频繁，请稍后重试
            requestId: req-example
            retryable: true
            retryAfterSeconds: 10
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    Forbidden:
      description: 没有执行此操作的权限。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 403
            errorCode: VI_FORBIDDEN
            msg: 没有执行此操作的权限
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unauthorized:
      description: 登录已失效，请重新登录。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 401
            errorCode: VI_AUTH_REQUIRED
            msg: 登录已失效，请重新登录
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="mini" 或 "admin"；不泄露令牌细节
    BadRequest:
      description: 请求格式不正确。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 400
            errorCode: VI_REQUEST_INVALID
            msg: 请求格式不正确
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
