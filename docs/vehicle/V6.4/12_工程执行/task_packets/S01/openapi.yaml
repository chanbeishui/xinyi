components:
  schemas:
    AfterSaleNote:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          description: 最后读取版本，用于条件更新；409必须重新获取，不静默覆盖
        note:
          type: string
        voucherFileIds:
          type: array
          items:
            type: string
            description: 服务端不透明主键，以字符串传输
      required:
      - expectedVersion
      - note
      description: 补充资料不覆盖原申请及已批金额。
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
          - VI_PHONE_PROOF_REQUIRED
          - VI_PHONE_PROOF_REUSED
          - VI_EMPLOYEE_LINK_CONFLICT
          - VI_EMPLOYEE_LINK_BLOCKED
          - VI_CONFIG_INVALID
          - VI_CONFIG_CHANGED
          - VI_SECRET_UNAVAILABLE
          - VI_PAYMENT_METHOD_DISABLED
          - VI_PAYMENT_METHOD_LOCKED
          - VI_SEND_RESULT_UNKNOWN
          - VI_SUBSCRIPTION_UNAVAILABLE
          - VI_OFFLINE_PROOF_CONFLICT
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    AfterSalePublic:
      type: object
      additionalProperties: false
      properties:
        caseId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        orderNo:
          type: string
          description: 服务端不透明主键，以字符串传输
        kind:
          type: string
          enum:
          - CANCEL_REFUND
          - REFUND_ONLY
        caseStatus:
          type: string
          enum:
          - PENDING_REVIEW
          - EXECUTING
          - CLOSED
          - REJECTED
        reviewStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        approvedAmount:
          type: integer
          format: int64
          minimum: 0
          description: 人民币分
        requestedAmount:
          type: integer
          format: int64
          minimum: 0
          description: 人民币分
        returnState:
          type: string
          enum:
          - UNDETERMINED
          - NOT_REQUIRED
          - WAIT_RETURN
          - RETURNED
        refundState:
          type: string
          enum:
          - NONE
          - NOT_REQUIRED
          - WAIT_RETURN
          - READY
          - PROCESSING
          - SUCCESS
          - UNKNOWN
          - ABNORMAL
          - CLOSED
        custody:
          type: string
          enum:
          - OWNER
          - DRIVER
          - STATION
        fulfillmentStatus:
          type: string
        refundNo:
          type: string
          description: 服务端不透明主键，以字符串传输
        version:
          type: integer
          format: int64
          description: 最后读取版本，用于条件更新；409必须重新获取，不静默覆盖
        createdAt:
          type: string
          format: date-time
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
          pattern: Z$
        updatedAt:
          type: string
          format: date-time
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
          pattern: Z$
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/AllowedAction'
          uniqueItems: true
        publicOpinion:
          type: string
          nullable: true
      required:
      - caseId
      - orderNo
      - kind
      - caseStatus
      - reviewStatus
      - returnState
      - refundState
      - version
      description: 车主本人售后，publicOpinion为对客户公开结论；内部审核意见另存，绝不盲映射
    AllowedAction:
      type: string
      description: 服务端按当前角色、对象状态、版本和实时授权计算的可执行动作集合；不能由客户端授予
      enum:
      - ADD_REVIEW
