        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permission: biz:owner:list
      x-authorization:
        realm: ADMIN
        scope: ORG_DEPT_STATION
        permission: biz:owner:list
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: OBJECT_404_HIDES_EXISTENCE
      x-contract-baseline: V6.4
  /api/admin/owners/{ownerId}/orders:
    get:
      operationId: V4_get_api_admin_owners__ownerId__orders
      summary: 车主关联orders
      tags:
      - ADMIN
      security:
      - AdminBearerAuth: []
      x-flow-ids:
      - F25
      description: 执行前校验当前真实身份、功能权限与对象所属范围。所有金额来自服务端核对，不因UI显示可点而放行。
      parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - name: pageNum
        in: query
        schema:
          type: integer
