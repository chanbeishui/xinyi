                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/VehicleRecord'
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                    description: 符合授权条件的总数
                required:
                - code
                - msg
                - rows
                - total
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
