  responses:
    UnprocessableEntity:
      description: 填写内容不符合要求。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 422
            errorCode: VI_DATA_INVALID
            msg: 填写内容不符合要求
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Conflict:
      description: 记录已变化，请刷新后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 409
            errorCode: VI_VERSION_CONFLICT
            msg: 记录已变化，请刷新后重试
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: VI_INTERNAL_ERROR
            msg: 处理失败，请联系服务人员
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    TooManyRequests:
      description: 操作过于频繁，请稍后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 429
            errorCode: VI_RATE_LIMITED
            msg: 操作过于频繁，请稍后重试
            requestId: req-example
            retryable: true
            retryAfterSeconds: 10
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    Forbidden:
      description: 没有执行此操作的权限。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
