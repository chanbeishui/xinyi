openapi: 3.0.3
info:
  title: X02 支付方式与微信商户运行时接入
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/app/owner/orders/{orderNo}/payment-options:
    get:
      operationId: V64_get_api_app_owner_orders_orderNo_payment_options
      summary: 本人订单可用支付方式
      tags:
      - MINI
      - INTEGRATION_V64
      description: 主PRD第23章。服务端校验真实主体、环境、权限、对象归属、状态和版本；密钥不回显、不入日志；所有副作用幂等。
      security:
      - MiniBearerAuth: []
      x-contract-baseline: V6.4
      x-flow-ids:
      - F45
      x-authorization:
        realm: MINI
        scope: OWNER_ORDER
        capability: OWNER_PAYMENT_OPTIONS
      parameters:
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: 真实处理后的公开/脱敏结果，不返回占位Ack
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/OrderPaymentOptions'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-capability: OWNER_PAYMENT_OPTIONS
      x-error-policy: UNIFORM_RESOURCE_ERRORS
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_FORBIDDEN
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_CONFIG_INVALID
      - VI_CONFIG_CHANGED
      - VI_SECRET_UNAVAILABLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_UPSTREAM_UNAVAILABLE
  /api/app/owner/orders/{orderNo}/offline-payment:
    post:
      operationId: V64_post_api_app_owner_orders_orderNo_offline_payment
      summary: 选择线下方式不标记已付款
      tags:
      - MINI
      - INTEGRATION_V64
      description: 主PRD第23章。服务端校验真实主体、环境、权限、对象归属、状态和版本；密钥不回显、不入日志；所有副作用幂等。
      security:
      - MiniBearerAuth: []
      x-contract-baseline: V6.4
      x-flow-ids:
      - F45
      x-authorization:
        realm: MINI
        scope: OWNER_ORDER
        capability: OWNER_OFFLINE_INTENT
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: UUID；按主体+动作+资源+键及请求摘要保存首次结果；同键不同体409，至少24h，资金/交接另有永久业务去重
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      - name: orderNo
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: 真实处理后的公开/脱敏结果，不返回占位Ack
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/Payment'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-capability: OWNER_OFFLINE_INTENT
      x-error-policy: UNIFORM_RESOURCE_ERRORS
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_FORBIDDEN
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_CONFIG_INVALID
      - VI_CONFIG_CHANGED
      - VI_SECRET_UNAVAILABLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_UPSTREAM_UNAVAILABLE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
components:
  schemas:
    PaymentIntentRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        expectedPolicyRevisionId: &id001
          type: string
          description: 内部Long对外十进制字符串
          pattern: ^[1-9][0-9]{0,18}$
      required:
      - expectedVersion
      - expectedPolicyRevisionId
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
          - VI_PHONE_PROOF_REQUIRED
          - VI_PHONE_PROOF_REUSED
          - VI_EMPLOYEE_LINK_CONFLICT
          - VI_EMPLOYEE_LINK_BLOCKED
          - VI_CONFIG_INVALID
          - VI_CONFIG_CHANGED
          - VI_SECRET_UNAVAILABLE
          - VI_PAYMENT_METHOD_DISABLED
          - VI_PAYMENT_METHOD_LOCKED
          - VI_SEND_RESULT_UNKNOWN
          - VI_SUBSCRIPTION_UNAVAILABLE
          - VI_OFFLINE_PROOF_CONFLICT
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    Payment:
      type: object
      properties:
        merchantTradeNo:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
        payStatus:
          $ref: '#/components/schemas/PaymentStatus'
        paidAmount:
          type: integer
          format: int64
          minimum: 0
          description: 人民币分，非浮点；上限按商户及业务校验
        paidAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
        queryRequired:
          type: boolean
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentPolicyRevisionId: *id001
        merchantProfileRevisionId:
          type: string
          description: 内部Long对外十进制字符串
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
        methodLocked:
          type: boolean
        capacityResolution:
          type: string
          enum:
          - HELD
          - RELEASED
          - REACQUIRED
          - MANUAL_CONFLICT
        offlineProofStatus:
          allOf:
          - $ref: '#/components/schemas/OfflineProofStatus'
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
      description: ' V6.4：支付方法在首个有效意图锁定；REVIEW_PENDING不等于已支付；线下实收核实成功才SUCCESS；容量冲突独立展示，不伪造预约恢复。'
      required:
      - paymentMethod
      - methodLocked
      - version
    OfflineProofStatus:
      type: string
      enum:
      - SUBMITTED
      - VERIFIED
      - REJECTED
    PaymentMethod:
      type: string
      enum:
      - UNSELECTED
      - WECHAT
      - OFFLINE
    PaymentStatus:
      type: string
      enum:
      - PENDING
      - REVIEW_PENDING
      - SUCCESS
      - CLOSED
      - UNKNOWN
    OrderPaymentOptions:
      type: object
      additionalProperties: false
      properties:
        orderNo:
          type: string
        paymentVersion:
          type: integer
          format: int64
          minimum: 0
        policyRevisionId: *id001
        options:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOption'
        lockedMethod:
          $ref: '#/components/schemas/PaymentMethod'
        expiresAt:
          type: string
          format: date-time
        newPaymentAllowed:
          type: boolean
      required:
      - orderNo
      - paymentVersion
      - policyRevisionId
      - options
      - lockedMethod
      - expiresAt
      - newPaymentAllowed
      description: 根据真实订单公司/站点确定收款配置，不接受用户自选收款主体。
    PaymentOption:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum:
          - WECHAT
          - OFFLINE
        available:
          type: boolean
        reasonCode:
          type: string
        label:
          type: string
        instructions:
          type: string
        receiverName:
          type: string
        bankName:
          type: string
        receiverAccountDisplay:
          type: string
          description: 仅本人线下支付页必要展示企业收款账号；不可进入公开配置
        offlineMethods:
          type: array
          items:
            type: string
            enum:
            - CASH
            - BANK_TRANSFER
          uniqueItems: true
          maxItems: 2
          description: 启用线下时至少一种；CASH可在公司柜台办理，不允许个人代收
        contactName:
          type: string
        contactPhone:
          type: string
        bankAccountName:
          type: string
      required:
      - method
      - available
      - label
      description: ' 本人订单授权范围内可返回受控企业收款账号以完成线下转账，不返回任何云/支付密钥或后台付款证明。'
  responses:
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: VI_INTERNAL_ERROR
            msg: 处理失败，请联系服务人员
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    TooManyRequests:
      description: 操作过于频繁，请稍后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 429
            errorCode: VI_RATE_LIMITED
            msg: 操作过于频繁，请稍后重试
            requestId: req-example
            retryable: true
            retryAfterSeconds: 10
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    UnprocessableEntity:
      description: 填写内容不符合要求。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 422
            errorCode: VI_DATA_INVALID
            msg: 填写内容不符合要求
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Conflict:
      description: 记录已变化，请刷新后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 409
            errorCode: VI_VERSION_CONFLICT
            msg: 记录已变化，请刷新后重试
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    NotFound:
      description: 记录不存在或不可访问。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 404
            errorCode: VI_RESOURCE_NOT_VISIBLE
            msg: 记录不存在或不可访问
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Forbidden:
      description: 没有执行此操作的权限。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 403
            errorCode: VI_FORBIDDEN
            msg: 没有执行此操作的权限
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unauthorized:
      description: 登录已失效，请重新登录。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 401
            errorCode: VI_AUTH_REQUIRED
            msg: 登录已失效，请重新登录
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="mini" 或 "admin"；不泄露令牌细节
    BadRequest:
      description: 请求格式不正确。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 400
            errorCode: VI_REQUEST_INVALID
            msg: 请求格式不正确
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
