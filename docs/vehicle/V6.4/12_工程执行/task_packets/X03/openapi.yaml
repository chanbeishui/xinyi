openapi: 3.0.3
info:
  title: X03 客户线下收退款与人工资金核实
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/admin/offline-payments:
    get:
      operationId: V64_get_api_admin_offline_payments
      summary: 客户线下收退款凭证列表
      tags:
      - ADMIN
      - INTEGRATION_V64
      description: 主PRD第23章。服务端校验真实主体、环境、权限、对象归属、状态和版本；密钥不回显、不入日志；所有副作用幂等。
      security:
      - AdminBearerAuth: []
      x-contract-baseline: V6.4
      x-flow-ids:
      - F45
      x-authorization:
        realm: ADMIN
        scope: PAYMENT_OWNER_SCOPE
        permission: biz:offlinepayment:query
      parameters:
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      - name: orderNo
        in: query
        required: false
        schema:
          type: string
      - name: direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OfflineProofDirection'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OfflineProofStatus'
      - name: pageNum
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 真实处理后的公开/脱敏结果，不返回占位Ack
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfflinePaymentProofView'
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                required:
                - code
                - msg
                - rows
                - total
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: biz:offlinepayment:query
      x-error-policy: UNIFORM_RESOURCE_ERRORS
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_FORBIDDEN
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_CONFIG_INVALID
      - VI_CONFIG_CHANGED
      - VI_SECRET_UNAVAILABLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_UPSTREAM_UNAVAILABLE
    post:
      operationId: V64_post_api_admin_offline_payments
      summary: 登记真实线下收款或已批准退款凭证
      tags:
      - ADMIN
      - INTEGRATION_V64
      description: 主PRD第23章。服务端校验真实主体、环境、权限、对象归属、状态和版本；密钥不回显、不入日志；所有副作用幂等。
      security:
      - AdminBearerAuth: []
      x-contract-baseline: V6.4
      x-flow-ids:
      - F45
      x-authorization:
        realm: ADMIN
        scope: PAYMENT_OWNER_SCOPE
        permission: biz:offlinepayment:create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: UUID；按主体+动作+资源+键及请求摘要保存首次结果；同键不同体409，至少24h，资金/交接另有永久业务去重
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      responses:
        '200':
          description: 真实处理后的公开/脱敏结果，不返回占位Ack
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/OfflinePaymentProofView'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: biz:offlinepayment:create
      x-error-policy: UNIFORM_RESOURCE_ERRORS
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_FORBIDDEN
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_CONFIG_INVALID
      - VI_CONFIG_CHANGED
      - VI_SECRET_UNAVAILABLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_UPSTREAM_UNAVAILABLE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflinePaymentProofCreate'
  /api/admin/offline-payments/{proofId}:
    get:
      operationId: V64_get_api_admin_offline_payments_proofId
      summary: 线下凭证只读详情
      tags:
      - ADMIN
      - INTEGRATION_V64
      description: 主PRD第23章。服务端校验真实主体、环境、权限、对象归属、状态和版本；密钥不回显、不入日志；所有副作用幂等。
      security:
      - AdminBearerAuth: []
      x-contract-baseline: V6.4
      x-flow-ids:
      - F45
      x-authorization:
        realm: ADMIN
        scope: PAYMENT_OWNER_SCOPE
        permission: biz:offlinepayment:query
      parameters:
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      - name: proofId
        in: path
        required: true
        schema: &id001
          type: string
          description: 内部Long对外十进制字符串
          pattern: ^[1-9][0-9]{0,18}$
      responses:
        '200':
          description: 真实处理后的公开/脱敏结果，不返回占位Ack
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/OfflinePaymentProofView'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: biz:offlinepayment:query
      x-error-policy: UNIFORM_RESOURCE_ERRORS
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_FORBIDDEN
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_CONFIG_INVALID
      - VI_CONFIG_CHANGED
      - VI_SECRET_UNAVAILABLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_UPSTREAM_UNAVAILABLE
  /api/admin/offline-payments/{proofId}/verify:
    post:
      operationId: V64_post_api_admin_offline_payments_proofId_verify
      summary: 不同人员核实线下资金
      tags:
      - ADMIN
      - INTEGRATION_V64
      description: 主PRD第23章。服务端校验真实主体、环境、权限、对象归属、状态和版本；密钥不回显、不入日志；所有副作用幂等。
      security:
      - AdminBearerAuth: []
      x-contract-baseline: V6.4
      x-flow-ids:
      - F45
      x-authorization:
        realm: ADMIN
        scope: PAYMENT_OWNER_SCOPE
        permission: biz:offlinepayment:verify
        notSelfReview: true
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: UUID；按主体+动作+资源+键及请求摘要保存首次结果；同键不同体409，至少24h，资金/交接另有永久业务去重
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      - name: proofId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: 真实处理后的公开/脱敏结果，不返回占位Ack
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/OfflinePaymentProofView'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: biz:offlinepayment:verify
      x-error-policy: UNIFORM_RESOURCE_ERRORS
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_FORBIDDEN
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_CONFIG_INVALID
      - VI_CONFIG_CHANGED
      - VI_SECRET_UNAVAILABLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_UPSTREAM_UNAVAILABLE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflinePaymentProofVerify'
components:
  schemas:
    OfflinePaymentProofVerify:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        decision:
          type: string
          enum:
          - VERIFY
          - REJECT
        reason: &id003
          type: string
          minLength: 2
          maxLength: 500
      required:
      - expectedVersion
      - decision
      - reason
      description: 真实资金核实与业务审核不同；不同人员复核。锁支付/退款/证明，资金唯一去重，再处理未关闭容量；原记录不可覆盖。
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
          - VI_PHONE_PROOF_REQUIRED
          - VI_PHONE_PROOF_REUSED
          - VI_EMPLOYEE_LINK_CONFLICT
          - VI_EMPLOYEE_LINK_BLOCKED
          - VI_CONFIG_INVALID
          - VI_CONFIG_CHANGED
          - VI_SECRET_UNAVAILABLE
          - VI_PAYMENT_METHOD_DISABLED
          - VI_PAYMENT_METHOD_LOCKED
          - VI_SEND_RESULT_UNKNOWN
          - VI_SUBSCRIPTION_UNAVAILABLE
          - VI_OFFLINE_PROOF_CONFLICT
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    OfflinePaymentProofView:
      type: object
      additionalProperties: false
      properties:
        proofId: *id001
        direction:
          $ref: '#/components/schemas/OfflineProofDirection'
        orderNo:
          type: string
        refundNo:
          type: string
        ownerDeptId: *id001
        amount:
          type: integer
          format: int64
          minimum: 0
        paidAt: &id002
          type: string
          format: date-time
        method:
          type: string
          enum:
          - CASH
          - BANK_TRANSFER
        externalReferenceMask:
          type: string
        voucherFiles:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              fileId: *id001
            required:
            - fileId
        status:
          $ref: '#/components/schemas/OfflineProofStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        registeredBy: *id001
        verifiedBy:
          type: string
          description: 内部Long对外十进制字符串
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
        registeredAt: *id002
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        verifyReason:
          type: string
        capacityResolution:
          type: string
          enum:
          - HELD
          - RELEASED
          - REACQUIRED
          - MANUAL_CONFLICT
      required:
      - proofId
      - direction
      - orderNo
      - ownerDeptId
      - amount
      - paidAt
      - status
      - version
      - registeredBy
      - registeredAt
      description: 仅后台资金权限且数据范围匹配；小程序只看支付结果投影，不返回银行流水或凭证。
    OfflineProofStatus:
      type: string
      enum:
      - SUBMITTED
      - VERIFIED
      - REJECTED
    OfflineProofDirection:
      type: string
      enum:
      - COLLECTION
      - REFUND
    OfflinePaymentProofCreate:
      type: object
      additionalProperties: false
      properties:
        direction:
          $ref: '#/components/schemas/OfflineProofDirection'
        orderNo:
          type: string
        refundNo:
          type: string
        expectedPaymentVersion:
          type: integer
          format: int64
          minimum: 0
        actualAmount:
          type: integer
          format: int64
          minimum: 1
        paidAt: *id002
        method:
          type: string
          enum:
          - CASH
          - BANK_TRANSFER
        externalReference:
          type: string
          minLength: 1
          maxLength: 128
        voucherFileIds:
          type: array
          items: *id001
          minItems: 1
          maxItems: 9
        note: *id003
      required:
      - direction
      - orderNo
      - expectedPaymentVersion
      - actualAmount
      - paidAt
      - method
      - externalReference
      - voucherFileIds
      - note
      description: COLLECTION必须等于本订单未付全额；REFUND必须关联该订单已批准的refundNo且金额完全匹配。部分/超额仅异常登记，不作为核实成功。文件须为私有可用凭证。
      oneOf:
      - properties:
          direction:
            type: string
            enum:
            - COLLECTION
        not:
          required:
          - refundNo
      - properties:
          direction:
            type: string
            enum:
            - REFUND
        required:
        - refundNo
  responses:
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: VI_INTERNAL_ERROR
            msg: 处理失败，请联系服务人员
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    TooManyRequests:
      description: 操作过于频繁，请稍后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 429
            errorCode: VI_RATE_LIMITED
            msg: 操作过于频繁，请稍后重试
            requestId: req-example
            retryable: true
            retryAfterSeconds: 10
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    UnprocessableEntity:
      description: 填写内容不符合要求。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 422
            errorCode: VI_DATA_INVALID
            msg: 填写内容不符合要求
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Conflict:
