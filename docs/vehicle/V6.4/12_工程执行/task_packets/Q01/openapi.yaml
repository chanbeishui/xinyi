openapi: 3.0.3
info:
  title: Q01 代驾资格草稿与提交
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/app/driver/qualification:
    get:
      operationId: API_042_get
      summary: 我的申请
      tags:
      - ACCOUNT
      description: OWNER/STATION/DRIVER均可按本人已核验手机号申请，ADMIN不适用。身份和当前视角取服务端，role/ownerDeptId/status/provider结果不能由客户端指定。草稿不是已认证，员工不免审。
      x-flow-ids:
      - F49
      security:
      - MiniBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Qualification'
                    nullable: true
                    type: object
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      x-capability: DRIVER_QUALIFICATION_LIST
      x-authorization:
        realm: MINI
        scope: SELF_APPLICATION
        capability: DRIVER_QUALIFICATION_LIST
        qualificationRequired: false
        principal: MINI_ACCOUNT
        roleRequirement: NONE
        requiredAccountConditions:
        - PHONE_VERIFIED
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
      x-authority-sources:
        subject: 可信MINI accountId与当前本人applicationId
        company: vi_driver_profile.owner_dept_id，提交时冻结
        proofs: 服务端当前材料绑定的vi_provider_verification，不采信客户端PASSED
    put:
      operationId: API_043_put
      summary: 保存资格草稿
      tags:
      - ACCOUNT
      description: OWNER/STATION/DRIVER均可按本人已核验手机号申请，ADMIN不适用。身份和当前视角取服务端，role/ownerDeptId/status/provider结果不能由客户端指定。草稿不是已认证，员工不免审。
      x-flow-ids:
      - F49
      security:
      - MiniBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Qualification'
                    nullable: true
                    type: object
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: UUID；按主体+动作+资源+键及请求摘要保存首次结果；同键不同体409，至少24h，资金/交接另有永久业务去重
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualificationDraft'
      x-capability: DRIVER_QUALIFICATION_EDIT
      x-authorization:
        realm: MINI
        scope: SELF_APPLICATION
        capability: DRIVER_QUALIFICATION_EDIT
        qualificationRequired: false
        principal: MINI_ACCOUNT
        roleRequirement: NONE
        requiredAccountConditions:
        - PHONE_VERIFIED
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_IDEMPOTENCY_CONFLICT
      - VI_SELECTION_CONFLICT
      - VI_CONTEXT_CHANGED
      - VI_SNAPSHOT_CHANGED
      - VI_DATA_INVALID
      - VI_EVIDENCE_INCOMPLETE
      - VI_HANDOVER_CODE_INVALID
      - VI_HANDOVER_LOCKED
      - VI_UNPRICED_LINES
      - VI_REFUND_LIMIT
      - VI_PAYMENT_LIMIT
      - VI_SERVICE_UNAVAILABLE
      - VI_CAPABILITY_NOT_CONFIGURED
      - VI_TRAINING_NOT_READY
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
      x-authority-sources:
        subject: 可信MINI accountId与当前本人applicationId
        company: vi_driver_profile.owner_dept_id，提交时冻结
        proofs: 服务端当前材料绑定的vi_provider_verification，不采信客户端PASSED
    post:
      summary: 建立本人代驾资格草稿
      description: OWNER/STATION/DRIVER均可按本人已核验手机号申请，ADMIN不适用。身份和当前视角取服务端，role/ownerDeptId/status/provider结果不能由客户端指定。草稿不是已认证，员工不免审。
      operationId: v5_post_api_app_driver_qualification
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
        description: 同主体+动作+目标的幂等键；同体重试返回原结果，异体409；还须永久业务唯一约束
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/Qualification'
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-flow-ids:
      - F49
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualificationCreate'
      x-capability: DRIVER_QUALIFICATION_CREATE
      security:
      - MiniBearerAuth: []
      x-authorization:
        realm: MINI
        scope: SELF_APPLICATION
        capability: DRIVER_QUALIFICATION_CREATE
        qualificationRequired: false
        principal: MINI_ACCOUNT
        roleRequirement: NONE
        requiredAccountConditions:
        - PHONE_VERIFIED
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_IDEMPOTENCY_CONFLICT
      - VI_SELECTION_CONFLICT
      - VI_CONTEXT_CHANGED
      - VI_SNAPSHOT_CHANGED
      - VI_DATA_INVALID
      - VI_EVIDENCE_INCOMPLETE
      - VI_HANDOVER_CODE_INVALID
      - VI_HANDOVER_LOCKED
      - VI_UNPRICED_LINES
      - VI_REFUND_LIMIT
      - VI_PAYMENT_LIMIT
      - VI_SERVICE_UNAVAILABLE
      - VI_CAPABILITY_NOT_CONFIGURED
      - VI_TRAINING_NOT_READY
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
      x-authority-sources:
        subject: 可信MINI accountId与当前本人applicationId
        company: vi_driver_profile.owner_dept_id，提交时冻结
        proofs: 服务端当前材料绑定的vi_provider_verification，不采信客户端PASSED
  /api/app/driver/qualification/submit:
    post:
      operationId: API_044_post
      summary: 提交资格审核
      tags:
      - ACCOUNT
      description: OWNER/STATION/DRIVER均可按本人已核验手机号申请，ADMIN不适用。身份和当前视角取服务端，role/ownerDeptId/status/provider结果不能由客户端指定。草稿不是已认证，员工不免审。
        资料完整、真实核验及培训全部通过才提交；必须当前材料版本/HMAC及可信verified_at，未接能力拒绝晋级。
      x-flow-ids:
      - F49
      security:
      - MiniBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Qualification'
                    nullable: true
                    type: object
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: UUID；按主体+动作+资源+键及请求摘要保存首次结果；同键不同体409，至少24h，资金/交接另有永久业务去重
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualificationSubmit'
      x-capability: DRIVER_QUALIFICATION_SUBMIT
      x-authorization:
        realm: MINI
        scope: SELF_APPLICATION
        capability: DRIVER_QUALIFICATION_SUBMIT
        qualificationRequired: false
        principal: MINI_ACCOUNT
        roleRequirement: NONE
        requiredAccountConditions:
        - PHONE_VERIFIED
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_IDEMPOTENCY_CONFLICT
      - VI_SELECTION_CONFLICT
      - VI_CONTEXT_CHANGED
      - VI_SNAPSHOT_CHANGED
      - VI_DATA_INVALID
      - VI_EVIDENCE_INCOMPLETE
      - VI_HANDOVER_CODE_INVALID
      - VI_HANDOVER_LOCKED
      - VI_UNPRICED_LINES
      - VI_REFUND_LIMIT
      - VI_PAYMENT_LIMIT
      - VI_SERVICE_UNAVAILABLE
      - VI_CAPABILITY_NOT_CONFIGURED
      - VI_TRAINING_NOT_READY
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
      x-authority-sources:
        subject: 可信MINI accountId与当前本人applicationId
        company: vi_driver_profile.owner_dept_id，提交时冻结
        proofs: 服务端当前材料绑定的vi_provider_verification，不采信客户端PASSED
components:
  schemas:
    QualificationSubmit:
      type: object
      additionalProperties: false
      properties:
        applicationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        expectedProfileVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - applicationId
      - expectedVersion
      - expectedProfileVersion
      - reason
      description: 用户确认：完整资料、有效公司、当前同意及DEVICE_AUTH/BACKGROUND/LICENSE/TRAINING四项当前材料可信通过后才待审。显式申请ID和档案版本防复审/公司漂移；提交冻结快照，不批准或授DRIVER。
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
          - VI_PHONE_PROOF_REQUIRED
          - VI_PHONE_PROOF_REUSED
          - VI_EMPLOYEE_LINK_CONFLICT
          - VI_EMPLOYEE_LINK_BLOCKED
          - VI_CONFIG_INVALID
          - VI_CONFIG_CHANGED
          - VI_SECRET_UNAVAILABLE
          - VI_PAYMENT_METHOD_DISABLED
          - VI_PAYMENT_METHOD_LOCKED
          - VI_SEND_RESULT_UNKNOWN
          - VI_SUBSCRIPTION_UNAVAILABLE
          - VI_OFFLINE_PROOF_CONFLICT
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    Qualification:
      type: object
      properties:
        applicationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        status:
          $ref: '#/components/schemas/QualificationStatus'
        items:
          type: array
          items:
            type: string
        rejectReasons:
          type: array
          items:
            type: string
        reviewDueAt:
          type: string
          format: date-time
          pattern: Z$
          nullable: true
        canAcceptOrder:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        driverId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
        profileVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        effectiveQualificationStatus:
          $ref: '#/components/schemas/QualificationStatus'
          description: 原生效档案的持久审核状态，不是实时可接单结论；本人实时状态见session.driverQualification，后台见effectiveQualification.effectiveStatus，新单每次另核准入。
        ownerDeptId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          nullable: true
        companyName:
          type: string
          nullable: true
        ownershipUnassigned:
          type: boolean
        materialRevision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        materialHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          nullable: true
        submissionRevision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        draft:
          $ref: '#/components/schemas/QualificationDraftView'
        editableFields:
          type: array
          uniqueItems: true
          items:
            type: string
        rejectFields:
          type: array
          uniqueItems: true
          items:
            type: string
          nullable: true
        publicReviewOpinion:
          type: string
          maxLength: 1000
          nullable: true
        submitBlockers:
          type: array
          items:
            $ref: '#/components/schemas/QualificationBlocker'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/QualificationCheck'
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AllowedAction'
        companyRevision:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
          format: int64
          maximum: 9007199254740991
        verificationSessionId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
          nullable: true
      additionalProperties: false
      required:
      - applicationId
      - status
      - items
      - rejectReasons
      - reviewDueAt
