components:
  schemas:
    DriverFeeTrial:
      type: object
      additionalProperties: false
      properties:
        rule:
          $ref: '#/components/schemas/DriverFeeRuleUpdate'
        contractDistanceMeter:
          type: integer
          format: int64
          minimum: 0
          description: 约定路线米
      required:
      - rule
      - contractDistanceMeter
    DriverFeeRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
        name:
          type: string
        payorEntityId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        currency:
          type: string
          enum:
          - CNY
        driverScope:
          type: array
          items:
            type: string
            description: 服务端不透明主键，以字符串传输
        vehicleTypeCodes:
          type: array
          items:
            type: string
        scenario:
          type: string
          enum:
          - NORMAL_RETURN
          - CANCEL_RETURN
          - CANCEL_BEFORE_PICKUP
        baseAmount:
          type: integer
          format: int64
          minimum: 0
          description: 人民币分
        includedDistanceMeter:
          type: integer
          format: int64
          minimum: 0
          description: 包含的约定路线距离米
        unitDistanceMeter:
          type: integer
          minimum: 1
        unitAmount:
          type: integer
          format: int64
          minimum: 0
          description: 人民币分
        rounding:
          type: string
          enum:
          - CEIL
          - HALF_UP
        routeBasis:
          type: string
          enum:
          - CONTRACT_ROUTE
        effectiveFrom:
          type: string
          format: date-time
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
          pattern: Z$
        effectiveTo:
          type: string
          format: date-time
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
          pattern: Z$
        changeReason:
          type: string
      required:
      - name
      - payorEntityId
      - currency
      - scenario
      - baseAmount
      - includedDistanceMeter
      - unitDistanceMeter
      - unitAmount
      - rounding
      - routeBasis
      - effectiveFrom
      - changeReason
      - expectedVersion
      description: 费用按约定路线快照计算；仪表里程仅留证。缺适用规则转待核价；已发布规则不可覆盖。
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_RATE_LIMITED
