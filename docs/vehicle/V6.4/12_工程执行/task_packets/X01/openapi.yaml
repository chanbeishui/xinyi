          - WECHATPAY_PUBLIC_KEY
          - PLATFORM_CERT
        wechatPayPublicKeyId:
          type: string
          maxLength: 128
        wechatPayPublicKeyPem:
          type: string
          maxLength: 16384
        platformCertificates:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              serial:
                type: string
              pem:
                type: string
                maxLength: 32768
            required:
            - serial
            - pem
        merchantCertificatePem:
          type: string
          maxLength: 32768
        bindingAcknowledged:
          type: boolean
        bindingEvidenceId: *id001
      description: mchid/appProfile是资金身份，关联交易后不得原位改为别家；此处校验是本地格式，不证明商户资格。回调地址由部署生成。
    ConfigReference:
      type: object
      additionalProperties: false
      properties:
        profileId: *id001
        revisionId: *id001
      required:
      - profileId
      - revisionId
      description: 引用已发布版本；服务端验证同环境/公司/应用和用途。
    PaymentPolicyConfigRedacted:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - PAYMENT_POLICY
        config:
          $ref: '#/components/schemas/PaymentPolicyConfig'
        credentialStates:
          type: object
          additionalProperties: false
          properties:
            offlineBankAccount:
              $ref: '#/components/schemas/SecretState'
      required:
      - kind
      - config
      - credentialStates
    PaymentPolicyConfig:
      type: object
      additionalProperties: false
      properties:
        offlineEnabled:
          type: boolean
        wechatEnabled:
          type: boolean
        wechatMerchant:
          $ref: '#/components/schemas/ConfigReference'
        offlineInstructions:
          type: string
          maxLength: 1000
        offlineCollectionMode:
          type: string
          enum:
          - PREPAID_MANUAL_VERIFIED
        offlineReceiverName:
          type: string
          maxLength: 200
        offlineBankName:
          type: string
          maxLength: 100
        offlineMethods:
          type: array
          items:
            type: string
            enum:
            - CASH
            - BANK_TRANSFER
          uniqueItems: true
          maxItems: 2
          description: 启用线下时至少一种；CASH可在公司柜台办理，不允许个人代收
        offlineContactName:
          type: string
          maxLength: 80
        offlineContactPhone:
          type: string
          maxLength: 30
          description: 正式公开企业服务电话，不使用员工隐私号码
        offlineAccountName:
          type: string
          maxLength: 200
      required:
      - offlineEnabled
      - wechatEnabled
      - offlineCollectionMode
      description: 两个开关独立；本期仅企业预收核实，不做先服务后付。银行账号单独密文管理，只在本人支付选项必要时返回。 发布时线下开关为真必须完整设置offlineMethods/联系人/说明；BANK_TRANSFER还需开户行、对公户名及已配置银行账号。支持方式与相关字段草稿阶段可不完整。
    IntegrationRollbackRequest:
      type: object
      additionalProperties: false
      properties:
        targetRevisionId: *id001
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        reason: *id002
        checkId: *id001
      required:
      - targetRevisionId
      - expectedVersion
      - reason
      - checkId
      description: 回滚形成新发布，重新验证目标密钥/模板有效性，不复活撤销凭据。
    IntegrationPublicationView:
      type: object
      additionalProperties: false
      properties:
        publicationId: *id001
        profileId: *id001
        revisionId: *id001
        previousRevisionId:
          type: string
          description: 内部Long对外十进制字符串
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
        action:
          type: string
          enum:
          - PUBLISH
          - ROLLBACK
        reason:
          type: string
        publishedAt: *id003
        publishedBy: *id001
        effectiveFor:
          type: string
          enum:
          - NEW_OPERATIONS
        historicalHandling:
          type: string
      required:
      - publicationId
      - profileId
      - revisionId
      - version
      - action
      - publishedAt
      - effectiveFor
    IntegrationPublishRequest:
      type: object
      additionalProperties: false
      properties:
        revisionId: *id001
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        contentHash: *id004
        checkId: *id001
        reason: *id002
        acknowledgeNoPaymentMethods:
          type: boolean
        expectedDependencyVersions:
          type: array
          items:
            $ref: '#/components/schemas/ConfigReference'
      required:
      - revisionId
      - expectedVersion
      - contentHash
      - checkId
      - reason
      description: 完整性与依赖版本服务端再次校验；两个开关都关需明确确认。失效的check不得发布。
    IntegrationCheckRequest:
      type: object
      additionalProperties: false
      properties:
        revisionId: *id001
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        level:
          $ref: '#/components/schemas/IntegrationCheckLevel'
      required:
      - revisionId
      - expectedVersion
      - level
    IntegrationCheckLevel:
      type: string
      enum:
      - LOCAL
      - READ_ONLY
      - LIVE_EVIDENCE
    IntegrationCheckView:
      type: object
      additionalProperties: false
      properties:
        checkId: *id001
        profileId: *id001
        revisionId: *id001
        contentHash: *id004
        level:
          $ref: '#/components/schemas/IntegrationCheckLevel'
        status:
          $ref: '#/components/schemas/IntegrationCheckStatus'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationValidationIssue'
        checkedAt: *id003
        expiresAt: *id003
        realPaymentVerified:
          type: boolean
      required:
      - checkId
      - profileId
      - revisionId
      - contentHash
      - level
      - status
      - issues
      - checkedAt
      - realPaymentVerified
      description: READ_ONLY不扣款不发信；本地通过不代表真实联调，按字段列明不能验证的项。
    IntegrationValidationIssue:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
          - ERROR
          - WARNING
        recovery:
          type: string
      required:
      - field
      - code
      - message
      - severity
    IntegrationCheckStatus:
      type: string
      enum:
      - NOT_RUN
      - PASS
      - FAIL
      - PARTIAL
    IntegrationDraftRequest:
      oneOf:
      - $ref: '#/components/schemas/PaymentPolicyConfigDraftRequest'
      - $ref: '#/components/schemas/WechatPayConfigDraftRequest'
      - $ref: '#/components/schemas/TencentSmsConfigDraftRequest'
      - $ref: '#/components/schemas/AliyunSmsConfigDraftRequest'
      - $ref: '#/components/schemas/WechatAppConfigDraftRequest'
      discriminator:
        propertyName: kind
        mapping:
          PAYMENT_POLICY: '#/components/schemas/PaymentPolicyConfigDraftRequest'
          WECHAT_PAY: '#/components/schemas/WechatPayConfigDraftRequest'
          TENCENT_SMS: '#/components/schemas/TencentSmsConfigDraftRequest'
          ALIYUN_SMS: '#/components/schemas/AliyunSmsConfigDraftRequest'
          WECHAT_APP: '#/components/schemas/WechatAppConfigDraftRequest'
    WechatAppConfigDraftRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - WECHAT_APP
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        config:
          $ref: '#/components/schemas/WechatAppConfig'
        credentials:
          type: object
          additionalProperties: false
          properties:
            appSecret:
              $ref: '#/components/schemas/SecretMutation'
        reason: *id002
      required:
      - kind
      - expectedVersion
      - config
      - reason
      description: 保存为不可变新草稿版本，不改变线上生效版本；密钥提交不回显。
    SecretMutation:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          action:
            type: string
            enum:
            - KEEP
        required:
        - action
      - type: object
        additionalProperties: false
        properties:
          action:
            type: string
            enum:
            - REPLACE
          value:
            type: string
            description: 只写，TLS提交后立即密文入库；日志和幂等响应不得保留原文
            minLength: 1
            maxLength: 32768
            writeOnly: true
        required:
        - action
        - value
      - type: object
        additionalProperties: false
        properties:
          action:
            type: string
            enum:
            - CLEAR
        required:
        - action
      description: 不传字段与KEEP等效。REPLACE不能传掩码。CLEAR若被有效配置或历史交易依赖则拒绝。
    AliyunSmsConfigDraftRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
