      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_CONFIG_INVALID
      - VI_CONFIG_CHANGED
      - VI_SECRET_UNAVAILABLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_UPSTREAM_UNAVAILABLE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationProfileCreate'
