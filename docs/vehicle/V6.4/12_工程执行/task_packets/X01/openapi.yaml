        signName:
          type: string
          maxLength: 100
        enabled:
          type: boolean
      required:
      - apiVersion
      - enabled
      description: 国内短信；SignName为已审核签名内容。SecretKey在credentials中写入；端点由服务器固定。
    WechatPayConfigRedacted:
      type: object
      additionalProperties: false
      properties:
        kind:
