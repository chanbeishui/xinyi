          type: boolean
      required:
      - apiVersion
      - enabled
      description: 国内短信，固定官方端点；AccessKeySecret在credentials中写入。
    TencentSmsConfigRedacted:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
