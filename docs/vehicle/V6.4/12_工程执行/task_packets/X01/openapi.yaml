    IntegrationProfileView:
      type: object
      additionalProperties: false
      properties:
        profileId: *id001
        kind:
          $ref: '#/components/schemas/IntegrationKind'
        name:
          type: string
        scope:
          $ref: '#/components/schemas/IntegrationScope'
        lifecycle:
          $ref: '#/components/schemas/IntegrationLifecycle'
        version:
          type: integer
          format: int64
          minimum: 0
        activeRevisionId:
          type: string
          description: 内部Long对外十进制字符串
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
        draftRevisionId:
          type: string
          description: 内部Long对外十进制字符串
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
        active:
          allOf:
          - $ref: '#/components/schemas/IntegrationRevisionView'
          nullable: true
        draft:
          allOf:
          - $ref: '#/components/schemas/IntegrationRevisionView'
          nullable: true
        validationIssues:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationValidationIssue'
        generatedPayNotifyUrl:
          type: string
        generatedRefundNotifyUrl:
          type: string
        newTransactionsEnabled:
          type: boolean
        historicalMaintenanceRequired:
          type: boolean
      required:
      - profileId
      - kind
      - name
      - scope
      - lifecycle
      - version
      - activeRevisionId
      - draftRevisionId
      - validationIssues
