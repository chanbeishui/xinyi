    PaymentPolicyConfigDraftRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - PAYMENT_POLICY
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        config:
          $ref: '#/components/schemas/PaymentPolicyConfig'
        credentials:
          type: object
          additionalProperties: false
          properties:
            offlineBankAccount:
              $ref: '#/components/schemas/SecretMutation'
        reason: *id002
      required:
