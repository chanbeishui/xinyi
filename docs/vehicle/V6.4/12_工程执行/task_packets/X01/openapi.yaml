          type: integer
          format: int64
          minimum: 0
        config:
          $ref: '#/components/schemas/AliyunSmsConfig'
        credentials:
          type: object
          additionalProperties: false
          properties:
            accessKeySecret:
              $ref: '#/components/schemas/SecretMutation'
