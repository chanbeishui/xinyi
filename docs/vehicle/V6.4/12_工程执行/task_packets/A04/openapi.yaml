components:
  responses:
    NotFound:
      description: 记录不存在或不可访问。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 404
            errorCode: VI_RESOURCE_NOT_VISIBLE
            msg: 记录不存在或不可访问
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
