                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/DriverAssignmentRecord'
                  total:
                    type: integer
                    format: int64
                    minimum: 0
