  /api/admin/drivers/{driverId}/assignments:
    get:
      operationId: V4_get_api_admin_drivers__driverId__assignments
      summary: 代驾承接服务记录
      tags:
      - ADMIN
      security:
      - AdminBearerAuth: []
      x-flow-ids:
      - F31
      - F32
      description: 真实ADMIN及对应功能/公司部门范围；权威归属driver.owner_dept_id，不取员工绑定、主部门或历史订单。空范围拒绝。写入版本、UUID和原因，审计/outbox同事务。 同时需要司机query与assignment:list；承接记录再按原订单真实部门过滤，row/total同范围。
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - name: pageNum
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: keyword
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - ENDED
          - RETURNED
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - acceptedAtDesc
          default: acceptedAtDesc
      responses:
        '200':
          description: 成功，返回当前业务事实
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/DriverAssignmentRecord'
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                    description: 符合授权条件的总数
                required:
