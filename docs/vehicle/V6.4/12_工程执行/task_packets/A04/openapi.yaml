  /api/admin/drivers/{driverId}/assignments:
    get:
      operationId: V4_get_api_admin_drivers__driverId__assignments
      summary: 代驾承接服务记录
      tags:
      - ADMIN
      security:
      - AdminBearerAuth: []
      x-flow-ids:
      - F31
      - F32
      description: 执行前校验当前真实身份、功能权限与对象所属范围。所有金额来自服务端核对，不因UI显示可点而放行。
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - name: pageNum
        in: query
        schema:
          type: integer
