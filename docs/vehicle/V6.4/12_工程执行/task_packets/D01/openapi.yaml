components:
  schemas:
    CompanyListeningConfigWrite:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        closingTime:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        locationMaxAgeSeconds:
          type: integer
          minimum: 31
          maximum: 86400
        reachabilityMaxAgeSeconds:
          type: integer
          minimum: 31
          maximum: 86400
        maxAccuracyMeter:
          type: integer
          minimum: 1
          maximum: 100000
        locationReportIntervalSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          description: 必须小于两个MaxAge；最少30秒为本系统节流约束，不作为微信官方频率承诺
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - expectedVersion
      - closingTime
      - locationMaxAgeSeconds
      - reachabilityMaxAgeSeconds
      - maxAccuracyMeter
      - locationReportIntervalSeconds
      - reason
      description: 公司统一每日配置，所有参数明确填写；原因加密审计。保存同事务立即生效，提前持久收紧当前窗口，延后不延长已开启窗口，不设置次日自动开启。
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
          - VI_PHONE_PROOF_REQUIRED
          - VI_PHONE_PROOF_REUSED
          - VI_EMPLOYEE_LINK_CONFLICT
          - VI_EMPLOYEE_LINK_BLOCKED
          - VI_CONFIG_INVALID
          - VI_CONFIG_CHANGED
          - VI_SECRET_UNAVAILABLE
          - VI_PAYMENT_METHOD_DISABLED
          - VI_PAYMENT_METHOD_LOCKED
          - VI_SEND_RESULT_UNKNOWN
          - VI_SUBSCRIPTION_UNAVAILABLE
          - VI_OFFLINE_PROOF_CONFLICT
        msg:
          type: string
