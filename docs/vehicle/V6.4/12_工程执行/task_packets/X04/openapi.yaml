openapi: 3.0.3
info:
  title: X04 腾讯云和阿里云短信及场景路由
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/admin/integrations/templates:
    get:
      operationId: V64_get_api_admin_integrations_templates
      summary: 短信与订阅模板列表
      tags:
      - ADMIN
      - INTEGRATION_V64
      description: 主PRD第23章。服务端校验真实主体、环境、权限、对象归属、状态和版本；密钥不回显、不入日志；所有副作用幂等。
      security:
      - AdminBearerAuth: []
      x-contract-baseline: V6.4
      x-flow-ids:
      - F44
      x-authorization:
        realm: ADMIN
        scope: ORG_DEPT_CONFIG
        permission: biz:messagetemplate:query
      parameters:
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      - name: provider
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ExternalMessageProvider'
      - name: scene
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NotificationScene'
      - name: ownerDeptId
        in: query
        required: false
        schema: &id001
          type: string
          description: 内部Long对外十进制字符串
          pattern: ^[1-9][0-9]{0,18}$
      - name: pageNum
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 真实处理后的公开/脱敏结果，不返回占位Ack
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalTemplateView'
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                required:
                - code
                - msg
                - rows
                - total
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: biz:messagetemplate:query
      x-error-policy: UNIFORM_RESOURCE_ERRORS
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_FORBIDDEN
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_CONFIG_INVALID
      - VI_CONFIG_CHANGED
      - VI_SECRET_UNAVAILABLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_UPSTREAM_UNAVAILABLE
    post:
      operationId: V64_post_api_admin_integrations_templates
      summary: 创建场景模板
      tags:
      - ADMIN
      - INTEGRATION_V64
      description: 主PRD第23章。服务端校验真实主体、环境、权限、对象归属、状态和版本；密钥不回显、不入日志；所有副作用幂等。
      security:
      - AdminBearerAuth: []
      x-contract-baseline: V6.4
      x-flow-ids:
      - F44
      x-authorization:
        realm: ADMIN
        scope: ORG_DEPT_CONFIG
        permission: biz:messagetemplate:create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: UUID；按主体+动作+资源+键及请求摘要保存首次结果；同键不同体409，至少24h，资金/交接另有永久业务去重
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      responses:
        '200':
          description: 真实处理后的公开/脱敏结果，不返回占位Ack
