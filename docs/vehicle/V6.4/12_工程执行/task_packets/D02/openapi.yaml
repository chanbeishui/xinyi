      tags:
      - ADMIN
      description: 显式真实公司或原订单数据范围；写入权限/CAS/UUID/业务/审计/outbox同事务。原因认证加密，响应无明文。
      x-flow-ids:
      - F10
      - F31
      security:
      - AdminBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - msg
                - data
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/DispatchCompanyPolicy'
                    nullable: true
                    type: object
          headers:
            Cache-Control:
              schema:
