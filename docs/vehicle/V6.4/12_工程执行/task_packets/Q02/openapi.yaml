          description: 最后读取的非负版本；更新CAS，冲突409
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - DISABLED
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
      required:
      - trainingId
      - courseVersion
      - title
      - status
      - version
      description: 仅后台课程维护权限可读标准答案；已发布版本不可原地修改
    QuestionOption:
