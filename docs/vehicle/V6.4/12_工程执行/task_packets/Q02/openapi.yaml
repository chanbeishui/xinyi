          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        requiredDurationSeconds:
          type: integer
          minimum: 1
        passScore:
          type: integer
          minimum: 0
          maximum: 100
        attemptTimeLimitSeconds:
          type: integer
          minimum: 60
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              type:
                type: string
