openapi: 3.0.3
info:
  title: Q02 培训课程和题库管理
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/admin/training-courses:
    get:
      summary: 培训课程管理列表
      description: 各公司独立维护，旗下站点及该公司代驾共用；Service按数据库owner_dept_id与功能独立校验，空范围fail-closed，不以主部门猜归属。列表不返回题库或标准答案。
      operationId: v5_get_api_admin_training_courses
      parameters:
      - in: query
        name: pageNum
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - in: query
        name: ownerDeptId
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - in: query
        name: keyword
        schema:
          type: string
          maxLength: 200
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - DISABLED
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - idDesc
          - titleAsc
          default: idDesc
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrainingCourseSummary'
                  total:
                    type: integer
                    minimum: 0
                required:
                - code
                - msg
                - rows
                - total
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
