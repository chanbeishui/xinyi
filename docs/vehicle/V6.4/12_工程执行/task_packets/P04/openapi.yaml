      - REPORT_DRIVER_PRESENCE
      - VIEW_DISPATCH_CANDIDATES
      - CREATE_MANUAL_INVITE
      - VIEW_DISPATCH_INVITES
      - EDIT_DISPATCH_POLICY
      - ACCEPT_INVITE
      - REJECT_INVITE
      - REVOKE_INVITE
      - VIEW_ASSIGNMENT
    ReconcileStatus:
      type: string
      enum:
      - OPEN
      - CHECKING
      - RESOLVED
    Refund:
      type: object
      properties:
        refundNo:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
        orderNo:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
        amount:
          type: integer
          format: int64
          minimum: 0
          description: 人民币分，非浮点；上限按商户及业务校验
        status:
          $ref: '#/components/schemas/ChannelRefundStatus'
        channelRefundId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          nullable: true
          description: 渠道不透明退款号，不能按数据库Long/19位限制解析。
        successAt:
          type: string
          format: date-time
          pattern: Z$
          nullable: true
        queryRequired:
          type: boolean
        version:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
        caseId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reviewRevision:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum:
          - WECHAT
          - OFFLINE
        executionMode:
          type: string
          enum:
          - WECHAT_API
          - MANUAL_OFFLINE
        manualProofState:
          allOf:
          - $ref: '#/components/schemas/OfflineProofStatus'
          nullable: true
        returnState:
          type: string
          enum:
          - UNDETERMINED
          - NOT_REQUIRED
          - WAIT_RETURN
          - RETURNED
        executionStartedAt:
          type: string
          format: date-time
          pattern: Z$
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
          maxLength: 64
        lastVerifiedAt:
          type: string
          format: date-time
          pattern: Z$
          nullable: true
        paidAmount:
          type: integer
          format: int64
          minimum: 0
        refundedAmount:
          type: integer
          format: int64
          minimum: 0
        reservedAmount:
          type: integer
          format: int64
          minimum: 0
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AllowedAction'
      additionalProperties: false
      description: 原支付收款主体下的稳定退款单；签名/金额/原交易核验后才归并渠道事实。UNKNOWN先查原号，可信未受理才可后台显式原号原参重试；CLOSED终态禁止原号重提。线下仅查询本地已记录进度，不调用微信，实际凭证核实交X06。不得以退款结果释放车辆承接。
      required:
      - refundNo
      - orderNo
      - amount
      - status
      - channelRefundId
      - successAt
      - version
      - caseId
      - reviewRevision
      - paymentMethod
      - executionMode
      - returnState
      - queryRequired
      - paidAmount
      - refundedAmount
      - reservedAmount
      - allowedActions
    OfflineProofStatus:
      type: string
      enum:
      - SUBMITTED
      - VERIFIED
      - REJECTED
    ChannelRefundStatus:
      type: string
      enum:
      - CREATED
      - PROCESSING
      - SUCCESS
      - CLOSED
      - ABNORMAL
      - UNKNOWN
  responses:
    UnprocessableEntity:
      description: 填写内容不符合要求。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 422
            errorCode: VI_DATA_INVALID
            msg: 填写内容不符合要求
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Conflict:
      description: 记录已变化，请刷新后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 409
            errorCode: VI_VERSION_CONFLICT
            msg: 记录已变化，请刷新后重试
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    NotFound:
      description: 记录不存在或不可访问。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 404
            errorCode: VI_RESOURCE_NOT_VISIBLE
            msg: 记录不存在或不可访问
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: VI_INTERNAL_ERROR
            msg: 处理失败，请联系服务人员
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    TooManyRequests:
      description: 操作过于频繁，请稍后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 429
            errorCode: VI_RATE_LIMITED
            msg: 操作过于频繁，请稍后重试
            requestId: req-example
            retryable: true
            retryAfterSeconds: 10
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    Forbidden:
      description: 没有执行此操作的权限。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 403
            errorCode: VI_FORBIDDEN
            msg: 没有执行此操作的权限
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unauthorized:
      description: 登录已失效，请重新登录。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 401
            errorCode: VI_AUTH_REQUIRED
            msg: 登录已失效，请重新登录
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="mini" 或 "admin"；不泄露令牌细节
    BadRequest:
      description: 请求格式不正确。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 400
            errorCode: VI_REQUEST_INVALID
            msg: 请求格式不正确
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
  securitySchemes:
    MiniBearerAuth:
      type: http
      scheme: bearer
      description: 小程序不透明随机访问令牌；数据库权威会话，非sys_user JWT；见T3.4
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 现有xinyi后台sys_user会话，不能作为小程序车主/代驾身份
