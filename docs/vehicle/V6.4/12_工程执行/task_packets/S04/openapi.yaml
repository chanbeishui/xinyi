components:
  schemas:
    VersionReason:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
        reason:
          type: string
          description: 必填；具体字段长度与原规范对齐，上限500字
      additionalProperties: false
      required:
      - expectedVersion
      - reason
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
          - VI_PHONE_PROOF_REQUIRED
          - VI_PHONE_PROOF_REUSED
          - VI_EMPLOYEE_LINK_CONFLICT
          - VI_EMPLOYEE_LINK_BLOCKED
          - VI_CONFIG_INVALID
          - VI_CONFIG_CHANGED
          - VI_SECRET_UNAVAILABLE
          - VI_PAYMENT_METHOD_DISABLED
          - VI_PAYMENT_METHOD_LOCKED
          - VI_SEND_RESULT_UNKNOWN
          - VI_SUBSCRIPTION_UNAVAILABLE
          - VI_OFFLINE_PROOF_CONFLICT
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    Exception:
      type: object
      properties:
        exceptionId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        orderNo:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
        type:
          type: string
        status:
          $ref: '#/components/schemas/ServiceCaseStatus'
        description:
          type: string
        resolution:
          type: string
        version:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
      additionalProperties: false
    ServiceCaseStatus:
      type: string
      enum:
      - OPEN
      - PROCESSING
      - RESOLVED
    DisputeResolve:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
        conclusion:
          type: string
        opinion:
          type: string
