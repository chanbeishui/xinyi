    Dispute:
      type: object
      properties:
        disputeId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        orderNo:
          type: string
          description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
        type:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ServiceCaseStatus'
        conclusion:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
        resolvedAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
        version:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
      additionalProperties: false
    ExceptionInput:
      type: object
      properties:
        type:
