          - DOCUMENT_MISSING
          - UPLOAD_FAILED
          - CONTACT_FAILED
          - OTHER
        description:
          type: string
        evidenceFileIds:
          type: array
          items:
            type: string
            description: 不透明ID，以字符串传输，避免JavaScript大整数精度丢失
        expectedOrderVersion:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
      additionalProperties: false
      required:
      - type
