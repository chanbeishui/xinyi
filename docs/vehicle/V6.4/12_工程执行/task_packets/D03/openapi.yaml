          maximum: 9007199254740991
          nullable: true
        overallDeadlineAt:
          type: string
          format: date-time
          pattern: Z$
          nullable: true
        radiusStage:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
        activeInviteId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
          nullable: true
        reasonCode:
          type: string
          nullable: true
        allowedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - VIEW_DISPATCH_CANDIDATES
            - CREATE_MANUAL_INVITE
            - VIEW_DISPATCH_INVITES
    DispatchBatchStatus:
      type: string
      enum:
      - RUNNING
      - WAIT_RESPONSE
      - PAUSED
      - ASSIGNED
      - MANUAL
      - CLOSED
    CancelStatus:
      type: string
      description: 一次售后决定派生的取消进展
      enum:
      - NONE
      - APPLIED
      - REJECTED
      - APPROVED_WAIT_RETURN
      - COMPLETED
    FulfillmentStatus:
      type: string
      description: 仅履约阶段；退款/对账不混入此状态
      enum:
      - PENDING_PAY
      - SCHEDULED
      - PENDING_DISPATCH
      - DISPATCHING
      - MANUAL_DISPATCH
      - ACCEPTED
      - GOING_PICKUP
      - ARRIVED_PICKUP
      - PICKED_UP
      - ARRIVED_STATION
      - INSPECTING
      - INSPECTED
      - CAR_TAKEN
      - WAIT_CONFIRM
      - COMPLETED
      - CANCELLED
      - CLOSED
