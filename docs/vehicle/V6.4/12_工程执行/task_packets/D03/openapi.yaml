openapi: 3.0.3
info:
  title: D03 人工邀约与计划变更
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/admin/dispatch/queue:
    get:
      operationId: API_098_get
      summary: 调度队列
      tags:
      - ADMIN
      description: D02真实派单整链：真实ADMIN功能权限及原订单dept范围，候选另限冻结服务公司。 服务端重验当前状态、独立CAS与绝对截止；接受不等于接车，关闭听单不释放责任。
      x-flow-ids:
      - F10
      security:
      - AdminBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - code
                - msg
                - rows
                - total
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/DispatchQueueItem'
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9007199254740991
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      - name: pageNum
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: orderNo
        in: query
        required: false
        schema:
          type: string
      - name: stationId
        in: query
        required: false
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_DISPATCH
          - DISPATCHING
          - MANUAL_DISPATCH
          - ACCEPTED
      - name: serviceCompanyId
        in: query
        required: false
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      x-permission: biz:dispatch:list
      x-authorization:
        realm: ADMIN
        scope: ORDER_AUTHORITATIVE_DEPT_AND_FROZEN_COMPANY_DRIVER_POOL
        permission: biz:dispatch:list
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
