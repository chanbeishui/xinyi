          - VI_PAYMENT_METHOD_LOCKED
          - VI_SEND_RESULT_UNKNOWN
          - VI_SUBSCRIPTION_UNAVAILABLE
          - VI_OFFLINE_PROOF_CONFLICT
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    EmployeeLinkRecheckResult:
      type: object
      additionalProperties: false
      properties:
        binding:
          $ref: '#/components/schemas/EmployeeLinkAdmin'
        requiresNewPhoneAuthorization:
          type: boolean
      required:
      - binding
      - requiresNewPhoneAuthorization
      description: 管理操作只取消自动重匹配阻止标记；不直接恢复SUSPENDED/REVOKED关联、不授角色；必须本人新的微信手机号授权后通过所有检查。
    EmployeeLinkAdmin:
      type: object
      additionalProperties: false
      properties:
        bindingId: &id001
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        accountId: *id001
        appId:
          type: string
        sysUserId: *id001
        employeeName:
          type: string
        phoneMask:
          type: string
        openIdMask:
          type: string
          description: 仅识别摘要，不返回完整微信标识
        status:
          $ref: '#/components/schemas/EmployeeBindingLifecycle'
        source:
          type: string
          enum:
          - WECHAT_PHONE_MATCH
        boundAt: &id002
          type: string
          format: date-time
          pattern: Z$
        lastPhoneVerifiedAt: *id002
        autoRebindBlocked:
          type: boolean
        version: *id003
      required:
      - bindingId
      - accountId
      - appId
      - sysUserId
      - employeeName
      - phoneMask
      - openIdMask
      - status
      - source
      - boundAt
      - lastPhoneVerifiedAt
      - autoRebindBlocked
      - version
      description: 后台数据范围校验后返回，任职范围需覆盖；不是新的员工账号管理。
    EmployeeBindingLifecycle:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      - REVOKED
      description: V6.4 身份自动关联领域取值
    EmployeeLinkReconcile:
      type: object
      additionalProperties: false
      properties:
        expectedContextVersion: *id003
      required:
      - expectedContextVersion
      description: 只重试当前账号已有的最近微信手机号验证结果（服务端有效窗口默认10分钟）；不接收任意手机号或目标员工，不重复消费phoneCode。到期必须重新手机号授权。
    EmployeeLinkPublic:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/EmployeeLinkStatus'
        workAccessEnabled:
          type: boolean
        authorizedStationCount:
          type: integer
          minimum: 0
        messageKey:
          type: string
          enum:
          - NO_EMPLOYEE_MATCH
          - EMPLOYEE_LINKED
          - WAIT_ADMIN_CONFIGURATION
          - CONTACT_ADMIN
          - PHONE_REVERIFY_REQUIRED
          - LINK_REVOKED
        canReverifyPhone:
          type: boolean
      required:
      - status
      - workAccessEnabled
      - authorizedStationCount
      - messageKey
      - canReverifyPhone
      description: 仅当前小程序账号公开投影；无sysUserId、员工名单、其他手机号、完整OpenID或后台权限。
    EmployeeLinkStatus:
      type: string
      enum:
      - UNLINKED
      - LINKED
      - NEEDS_ADMIN
      - SUSPENDED
      - REVOKED
      description: 小程序只返回本人关联粗粒度结果；重号/冲突不透露其他员工或账号
  responses:
    UnprocessableEntity:
      description: 填写内容不符合要求。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 422
            errorCode: VI_DATA_INVALID
            msg: 填写内容不符合要求
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Conflict:
      description: 记录已变化，请刷新后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 409
            errorCode: VI_VERSION_CONFLICT
            msg: 记录已变化，请刷新后重试
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: VI_INTERNAL_ERROR
            msg: 处理失败，请联系服务人员
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    TooManyRequests:
      description: 操作过于频繁，请稍后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 429
            errorCode: VI_RATE_LIMITED
            msg: 操作过于频繁，请稍后重试
            requestId: req-example
            retryable: true
            retryAfterSeconds: 10
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    Forbidden:
      description: 没有执行此操作的权限。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 403
            errorCode: VI_FORBIDDEN
            msg: 没有执行此操作的权限
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unauthorized:
      description: 登录已失效，请重新登录。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 401
            errorCode: VI_AUTH_REQUIRED
            msg: 登录已失效，请重新登录
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="mini" 或 "admin"；不泄露令牌细节
    BadRequest:
      description: 请求格式不正确。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 400
            errorCode: VI_REQUEST_INVALID
            msg: 请求格式不正确
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
