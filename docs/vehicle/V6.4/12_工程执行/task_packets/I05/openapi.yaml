components:
  schemas:
    EmployeeLinkAction:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: &id003
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - expectedVersion
      - reason
      description: 管理员权限+目标全部任职范围校验；不能提交目标openid替换。暂停/撤销与权限版本、审计、事件同事务。
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
