      tags:
      - 身份与站点授权
      description: 查询本人自动关联状态；状态/版本/真实归属由服务端检查，结果不代表自动获得代驾资格。
      x-flow-ids:
      - F02
      security:
      - MiniBearerAuth: []
      responses:
        '200':
          description: 服务端成功结果；不缓存身份响应
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/EmployeeLinkPublic'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: []
      x-authorization:
        realm: MINI
        scope: SELF
        capability: EMPLOYEE_LINK_READ
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
      x-capability: EMPLOYEE_LINK_READ
