      tags:
      - 身份与站点授权
      description: 查询本人手机号授权处理结果；状态/版本/真实归属由服务端检查，结果不代表自动获得代驾资格。
      x-flow-ids:
      - F02
      security:
      - MiniBearerAuth: []
      responses:
        '200':
          description: 服务端成功结果；不缓存身份响应
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
