components:
  responses:
    Unavailable:
      description: 权限权威状态暂不可读取。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 503
            errorCode: VI_AUTHORITY_UNAVAILABLE
            msg: 权限权威状态暂不可读取
            requestId: req-example
            retryable: true
            retryAfterSeconds: null
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: 处理失败，请联系服务人员。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 500
            errorCode: VI_INTERNAL_ERROR
            msg: 处理失败，请联系服务人员
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    TooManyRequests:
      description: 操作过于频繁，请稍后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 429
            errorCode: VI_RATE_LIMITED
            msg: 操作过于频繁，请稍后重试
            requestId: req-example
            retryable: true
            retryAfterSeconds: 10
            data: {}
      headers:
        Retry-After:
          description: 建议等待秒数；429必带，503仅在可估计时返回
          schema:
            type: integer
            minimum: 1
    Forbidden:
      description: 没有执行此操作的权限。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 403
            errorCode: VI_FORBIDDEN
            msg: 没有执行此操作的权限
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Unauthorized:
      description: 登录已失效，请重新登录。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 401
            errorCode: VI_AUTH_REQUIRED
            msg: 登录已失效，请重新登录
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="mini" 或 "admin"；不泄露令牌细节
    BadRequest:
      description: 请求格式不正确。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 400
            errorCode: VI_REQUEST_INVALID
            msg: 请求格式不正确
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    UnprocessableEntity:
      description: 填写内容不符合要求。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 422
            errorCode: VI_DATA_INVALID
            msg: 填写内容不符合要求
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
    Conflict:
      description: 记录已变化，请刷新后重试。参见errorCode注册表；HTTP状态与code一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: 409
            errorCode: VI_VERSION_CONFLICT
            msg: 记录已变化，请刷新后重试
            requestId: req-example
            retryable: false
            retryAfterSeconds: null
            data: {}
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
