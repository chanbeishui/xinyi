openapi: 3.0.3
info:
  title: Q03 学习播放与考试尝试
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/app/driver/qualification/training:
    get:
      operationId: API_046_get
      summary: 培训与考试任务
      tags:
      - ACCOUNT
      description: 真实已核验MINI本人申请，OWNER/STATION/DRIVER同标准，不要求先具备DRIVER。当前公司epoch/材料/app/run/固定课表实时校验，旧目标不漂移；GET不创建课表或运行。
      x-flow-ids:
      - F41
      security:
      - MiniBearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Training'
                    type: object
                    nullable: true
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      x-capability: DRIVER_QUALIFICATION_LIST
      x-authorization:
        realm: MINI
        scope: SELF_QUALIFICATION
        capability: DRIVER_QUALIFICATION_LIST
        qualificationRequired: false
        principal: MINI_ACCOUNT
        roleRequirement: NONE
        requiredAccountConditions:
        - ACTIVE
        - PHONE_VERIFIED
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
