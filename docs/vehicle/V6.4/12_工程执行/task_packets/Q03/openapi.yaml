openapi: 3.0.3
info:
  title: Q03 学习播放与考试尝试
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/app/driver/qualification/training:
    get:
      operationId: API_046_get
      summary: 培训与考试任务
      tags:
      - ACCOUNT
      description: '流程：F04。审核前允许基础账号申请，不要求已拥有正式DRIVER角色；真实第三方核验状态只能从受信服务取得

        参数校验、真实归属、服务端当前状态/版本先于写入；不接受主体伪造。；主体为已验证的MINI基础账号，申请/培训/进度不要求已获DRIVER角色；本人记录校验。审核通过前不可接单。'
      x-flow-ids:
      - F04
      security:
      - MiniBearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/Training'
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      x-capability: DRIVER_QUALIFICATION_LIST
      x-authorization:
        realm: MINI
        scope: SELF_QUALIFICATION
        capability: DRIVER_QUALIFICATION_LIST
        qualificationRequired: false
        principal: MINI_ACCOUNT
        roleRequirement: NONE
        requiredAccountConditions:
        - ACTIVE
        - PHONE_VERIFIED
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
