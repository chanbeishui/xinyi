openapi: 3.0.3
info:
  title: Q05 资格审批与到期复审
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/admin/driver-qualifications:
    get:
      operationId: API_121_get
      summary: 资格审核列表
      tags:
      - ADMIN
      description: '流程：F04。权限码为建议，须映射实际仓库；非全局角色必须有站点范围；审核不允许自己审批自己的申请

        参数校验、真实归属、服务端当前状态/版本先于写入；不接受主体伪造。'
      x-flow-ids:
      - F49
      security:
      - AdminBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Qualification'
                  total:
                    type: integer
                    minimum: 0
                additionalProperties: false
                required:
                - code
                - msg
                - rows
                - total
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      - name: pageNum
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      x-permission: biz:driverqualification:list
      x-authorization:
        realm: ADMIN
        scope: ORG_DEPT_STATION
        permission: biz:driverqualification:list
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
  /api/admin/driver-qualifications/{applicationId}:
    get:
      operationId: API_122_get
      summary: 资格审核详情
      tags:
      - ADMIN
      description: '流程：F04。权限码为建议，须映射实际仓库；非全局角色必须有站点范围；审核不允许自己审批自己的申请

        参数校验、真实归属、服务端当前状态/版本先于写入；不接受主体伪造。'
      x-flow-ids:
      - F49
      security:
      - AdminBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Qualification'
                    nullable: true
                    type: object
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      x-permission: biz:driverqualification:query
      x-authorization:
        realm: ADMIN
        scope: ORG_DEPT_STATION
        permission: biz:driverqualification:query
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: OBJECT_404_HIDES_EXISTENCE
      x-contract-baseline: V6.4
  /api/admin/driver-qualifications/{applicationId}/audit:
    post:
      operationId: API_123_post
      summary: 批准或驳回资格
      tags:
      - ADMIN
      description: '流程：F04。权限码为建议，须映射实际仓库；非全局角色必须有站点范围；审核不允许自己审批自己的申请

        参数校验、真实归属、服务端当前状态/版本先于写入；不接受主体伪造。'
      x-flow-ids:
      - F49
      security:
      - AdminBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Qualification'
                    nullable: true
                    type: object
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          description: UUID；按主体+动作+资源+键及请求摘要保存首次结果；同键不同体409，至少24h，资金/交接另有永久业务去重
      - name: X-Client-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - owner
          - driver
          - station
          - admin
        description: 仅审计来源，不作为授权；须匹配服务端会话视角
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualificationAudit'
      x-permission: biz:driverqualification:audit
      x-authorization:
        realm: ADMIN
        scope: ORG_DEPT_STATION
        permission: biz:driverqualification:audit
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_IDEMPOTENCY_CONFLICT
      - VI_SELECTION_CONFLICT
      - VI_CONTEXT_CHANGED
      - VI_SNAPSHOT_CHANGED
      - VI_DATA_INVALID
      - VI_EVIDENCE_INCOMPLETE
      - VI_HANDOVER_CODE_INVALID
      - VI_HANDOVER_LOCKED
      - VI_UNPRICED_LINES
      - VI_REFUND_LIMIT
      - VI_PAYMENT_LIMIT
      - VI_SERVICE_UNAVAILABLE
      - VI_CAPABILITY_NOT_CONFIGURED
      - VI_TRAINING_NOT_READY
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: OBJECT_404_HIDES_EXISTENCE
      x-contract-baseline: V6.4
components:
  schemas:
    QualificationAudit:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: 客户端最后读取的版本；服务端条件更新，冲突返回409
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        opinion:
          type: string
        reviewDueAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO8601 UTC时刻，必须Z结尾；显示与业务日期Asia/Shanghai
      additionalProperties: false
      required:
      - expectedVersion
      - decision
      - opinion
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: integer
          description: 等于HTTP状态
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 422
          - 429
          - 500
          - 503
        errorCode:
          type: string
          enum:
          - VI_REQUEST_INVALID
          - VI_AUTH_REQUIRED
          - VI_TOKEN_REALM_MISMATCH
          - VI_REFRESH_REUSED
          - VI_FORBIDDEN
          - VI_SELF_REVIEW_DENIED
          - VI_RESOURCE_NOT_VISIBLE
          - VI_VERSION_CONFLICT
          - VI_STATE_CONFLICT
          - VI_IDEMPOTENCY_CONFLICT
          - VI_SELECTION_CONFLICT
          - VI_CONTEXT_CHANGED
          - VI_SNAPSHOT_CHANGED
          - VI_DATA_INVALID
          - VI_EVIDENCE_INCOMPLETE
          - VI_HANDOVER_CODE_INVALID
          - VI_HANDOVER_LOCKED
          - VI_UNPRICED_LINES
          - VI_REFUND_LIMIT
          - VI_PAYMENT_LIMIT
          - VI_SERVICE_UNAVAILABLE
          - VI_CAPABILITY_NOT_CONFIGURED
          - VI_TRAINING_NOT_READY
          - VI_RATE_LIMITED
          - VI_INTERNAL_ERROR
          - VI_AUTHORITY_UNAVAILABLE
          - VI_UPSTREAM_UNAVAILABLE
          - VI_PHONE_PROOF_REQUIRED
          - VI_PHONE_PROOF_REUSED
          - VI_EMPLOYEE_LINK_CONFLICT
          - VI_EMPLOYEE_LINK_BLOCKED
          - VI_CONFIG_INVALID
          - VI_CONFIG_CHANGED
          - VI_SECRET_UNAVAILABLE
          - VI_PAYMENT_METHOD_DISABLED
          - VI_PAYMENT_METHOD_LOCKED
          - VI_SEND_RESULT_UNKNOWN
          - VI_SUBSCRIPTION_UNAVAILABLE
          - VI_OFFLINE_PROOF_CONFLICT
        msg:
          type: string
          description: 服务端安全人类文案，前端逻辑按errorCode而非此文本
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
          nullable: true
        data:
          $ref: '#/components/schemas/ApiErrorDetails'
      required:
      - code
      - errorCode
      - msg
      - requestId
      - retryable
      - retryAfterSeconds
      - data
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        missingPhotoTypes:
          type: array
          items:
            $ref: '#/components/schemas/PhotoType'
        remainingAttempts:
          type: integer
          minimum: 0
          nullable: true
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    Qualification:
      type: object
      properties:
        applicationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        status:
          $ref: '#/components/schemas/QualificationStatus'
        items:
          type: array
          items:
            type: string
        rejectReasons:
          type: array
          items:
            type: string
        reviewDueAt:
          type: string
          format: date-time
          pattern: Z$
          nullable: true
        canAcceptOrder:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        driverId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
        profileVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        effectiveQualificationStatus:
          $ref: '#/components/schemas/QualificationStatus'
        ownerDeptId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          nullable: true
        companyName:
          type: string
          nullable: true
        ownershipUnassigned:
          type: boolean
        materialRevision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        materialHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          nullable: true
        submissionRevision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        draft:
          $ref: '#/components/schemas/QualificationDraftView'
        editableFields:
          type: array
          uniqueItems: true
          items:
            type: string
        rejectFields:
          type: array
          uniqueItems: true
          items:
            type: string
          nullable: true
        publicReviewOpinion:
          type: string
          maxLength: 1000
          nullable: true
        submitBlockers:
          type: array
          items:
            $ref: '#/components/schemas/QualificationBlocker'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/QualificationCheck'
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AllowedAction'
      additionalProperties: false
      required:
      - applicationId
      - status
      - items
      - rejectReasons
      - reviewDueAt
      - canAcceptOrder
      - version
      - driverId
      - profileVersion
      - effectiveQualificationStatus
      - ownerDeptId
      - companyName
      - ownershipUnassigned
      - materialRevision
      - materialHash
      - submissionRevision
      - draft
      - editableFields
      - rejectFields
      - publicReviewOpinion
      - submitBlockers
      - checks
      - allowedActions
      description: status为本次申请，effectiveQualificationStatus为原生效档案，两者不得混写。复审另建申请不抹已批准资格/证件/听单/任务；Q01 canAcceptOrder=false。内部review_opinion不公开，历史无rejectFields不猜全部可改。提交材料/公司/同意/证明写不可变快照，后台批准由Q05负责。
    QualificationStatus:
      type: string
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - REJECTED
      - EXPIRED
      - SUSPENDED
    QualificationDraftView:
      type: object
      additionalProperties: false
      properties:
        realName:
          type: string
          maxLength: 64
          nullable: true
        idCardNoMask:
          type: string
          nullable: true
        idCardNoProvided:
          type: boolean
        idCardFrontFileId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          nullable: true
        idCardBackFileId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          nullable: true
        licenseMainFileId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          nullable: true
        licenseSubFileId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          nullable: true
        licenseClass:
          type: string
          maxLength: 32
          nullable: true
        firstIssueDate:
          type: string
          format: date
          nullable: true
        validFrom:
          type: string
          format: date
          nullable: true
        validTo:
          type: string
          format: date
          nullable: true
        longTermValid:
          type: boolean
        consentVersion:
          type: string
          maxLength: 64
          nullable: true
        consentAcceptedAt:
          type: string
          format: date-time
          pattern: Z$
          nullable: true
        consentTextHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 已阅读公开资格申请正文的UTF8 SHA256；与版本、明确同意同组提交，正文即使同版本变更也409。
          nullable: true
      required:
      - realName
      - idCardNoMask
      - idCardNoProvided
      - idCardFrontFileId
      - idCardBackFileId
      - licenseMainFileId
      - licenseSubFileId
      - licenseClass
      - firstIssueDate
      - validFrom
      - validTo
      - longTermValid
      - consentVersion
      - consentAcceptedAt
      - consentTextHash
      description: 仅本人授权读取；身份证只回掩码和存在标志，不将掩码当原值回写。证件使用当前申请私有ID。
    QualificationBlocker:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    QualificationCheck:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - REALNAME
          - FACE
          - BACKGROUND
          - LICENSE
          - TRAINING
        status:
          type: string
          enum:
          - CREATED
          - PROCESSING
          - PASSED
          - FAILED
          - EXPIRED
          - UNAVAILABLE
      required:
      - type
      - status
      description: 服务端权威记录，PASSED须同申请/当前材料有密钥摘要和版本、真实核验时刻。TRAINING是Q03依据正式课程/学习阅卷产生的汇总证明；Q01不猜必修课程集合，也无客户端写通过通路。未接通无证明则UNAVAILABLE。
    AllowedAction:
      type: string
      description: 服务端按当前角色、对象状态、版本和实时授权计算的可执行动作集合；不能由客户端授予
      enum:
      - ADD_REVIEW
      - ADD_TO_DRAFT
      - APPEAL_PENALTY
      - APPLY_ADJUSTMENT
      - APPLY_CANCEL_REFUND
      - APPLY_REFUND_ONLY
      - APPROVE_AND_SEND
      - ARRIVE_PICKUP
      - ARRIVE_STATION
      - CANCEL_ASSIGNMENT
      - CLOSE_UNPAID
      - CONFIRM_HANDOVER
      - CONFIRM_STATEMENT
      - CONTACT_DRIVER
      - CONTACT_OWNER
      - CONTACT_STATION
      - CREATE_HANDOVER
      - DEPART
      - EDIT_PRICE
      - EXPORT
      - FILL_MILEAGE
      - FILL_PRICE
      - MANUAL_INVITE
      - MARK_EVIDENCE_READY
      - OPEN_DISPUTE
      - PAY
      - RECORD_PAYMENT
      - REGISTER_RESULT
      - REJECT_REVIEW
      - REMOVE_FROM_DRAFT
      - RENOTIFY_PICKUP
      - REPORT_DIFFERENCE
      - REPORT_EXCEPTION
      - REQUEST_RESULT_CORRECTION
      - REVIEW_AFTERSALE
      - REVIEW_LICENSE
      - SEND_STATEMENT
      - SERVICE_CONFIRM
      - SUBMIT_REVIEW
      - UPLOAD_PHOTO
      - VERIFY_PAYMENT
      - VIEW_APPEAL
      - VIEW_DETAIL
      - VIEW_EVIDENCE
      - VIEW_HANDOVER_SECRET
      - VIEW_PAYMENT
      - VIEW_PRICE_HISTORY
      - VIEW_PRICING
      - VIEW_RESULT
      - VOID_STATEMENT
