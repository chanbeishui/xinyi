          nullable: true
      description: 错误详情固定白名单；无明文Token/凭证/交接码/SQL
    PhotoType:
      type: string
      enum:
      - FRONT
      - BACK
      - LEFT
      - RIGHT
      - DASHBOARD
      - INTERIOR
      - EXTRA
    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        reasonCode:
          type: string
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: 最后读取的非负版本；更新CAS，冲突409
          nullable: true
      required:
      - resourceType
      - resourceId
      - reasonCode
      - currentVersion
      description: 仅返回调用者已获权对象，禁止泄露其他账单成员
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reasonCode:
          type: string
        message:
          type: string
      required:
      - field
      - reasonCode
      - message
    Qualification:
      type: object
      properties:
        applicationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
        status:
          $ref: '#/components/schemas/QualificationStatus'
        items:
          type: array
          items:
            type: string
        rejectReasons:
          type: array
          items:
            type: string
        reviewDueAt:
          type: string
          format: date-time
          pattern: Z$
          nullable: true
        canAcceptOrder:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        driverId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
        profileVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        effectiveQualificationStatus:
          $ref: '#/components/schemas/QualificationStatus'
          description: 原生效档案的持久审核状态，不是实时可接单结论；本人实时状态见session.driverQualification，后台见effectiveQualification.effectiveStatus，新单每次另核准入。
        ownerDeptId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          nullable: true
        companyName:
          type: string
          nullable: true
        ownershipUnassigned:
          type: boolean
        materialRevision:
          type: integer
