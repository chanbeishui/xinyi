openapi: 3.0.3
info:
  title: Q05 资格审批与到期复审
  version: 6.4.0
servers:
- url: http://localhost:8080
  description: 本地Java直连；paths已包含/api，不再次追加
- url: https://{host}
  description: 发布域名仅作部署变量；由环境设置真实已备案域名，代理保留/api
  variables:
    host:
      default: api.example.invalid
      description: 占位不可用于真实支付或发布
paths:
  /api/admin/driver-qualifications:
    get:
      operationId: API_121_get
      summary: 资格审核列表
      tags:
      - ADMIN
      description: 真实ADMIN独立投影，不复用本人动态会话门禁。读取已认证提交的材料/同意/四项父证明，原MINI退出或新登录不撤销已提交事实；当前公司或epoch变化不能批准旧提交。后台原图另需敏感与文件权限/原公司范围、目的理由及60秒上下文票；只允许当前提交的四图。
      x-flow-ids:
      - F49
      security:
      - AdminBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/QualificationAdminSummary'
                  total:
                    type: integer
                    minimum: 0
                additionalProperties: false
                required:
                - code
                - msg
                - rows
                - total
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - in: header
        name: X-Client-Type
        required: true
        schema:
          type: string
          enum:
          - admin
      - in: query
        name: pageNum
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - in: query
        name: ownerDeptId
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/QualificationStatus'
      - in: query
        name: keyword
        schema:
          type: string
          maxLength: 100
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - submittedAtDesc
          - idDesc
          default: submittedAtDesc
      x-permission: biz:driverqualification:list
      x-authorization:
        realm: ADMIN
        scope: COMPANY_OWNER_DEPT
        permission: biz:driverqualification:list
        scopeDetails: 读取按提交原公司，当前公司投影另需当前query；审核query/audit覆盖原与当前公司并集，批准再核冻结公司epoch。
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: GLOBAL_FAILURES_NO_RESOURCE_404
      x-contract-baseline: V6.4
  /api/admin/driver-qualifications/{applicationId}:
    get:
      operationId: API_122_get
      summary: 资格审核详情
      tags:
      - ADMIN
      description: 真实ADMIN独立投影，不复用本人动态会话门禁。读取已认证提交的材料/同意/四项父证明，原MINI退出或新登录不撤销已提交事实；当前公司或epoch变化不能批准旧提交。后台原图另需敏感与文件权限/原公司范围、目的理由及60秒上下文票；只允许当前提交的四图。
      x-flow-ids:
      - F49
      security:
      - AdminBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/QualificationAdminDetail'
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - in: header
        name: X-Client-Type
        required: true
        schema:
          type: string
          enum:
          - admin
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      x-permission: biz:driverqualification:query
      x-authorization:
        realm: ADMIN
        scope: COMPANY_OWNER_DEPT
        permission: biz:driverqualification:query
        scopeDetails: 读取按提交原公司，当前公司投影另需当前query；审核query/audit覆盖原与当前公司并集，批准再核冻结公司epoch。
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: OBJECT_404_HIDES_EXISTENCE
      x-contract-baseline: V6.4
  /api/admin/driver-qualifications/{applicationId}/audit:
    post:
      operationId: API_123_post
      summary: 批准或驳回资格
      tags:
      - ADMIN
      description: 恰9键、显式申请/档案/提交revision/公司epoch及UUID，不接收审批人、归属、通过证明或行政开关。批准要求当前公司与冻结公司epoch一致、可信材料和四证明及有效证件；实际截止取复审UTC与证件上海到期次日较早值。驳回/历史补正必须公开意见及精确补正字段，不新授资格。旧REJECTED缺字段仅修复结构，历史未封存提交不得批准或开放原图；复审驳回保留原有效资格。
      x-flow-ids:
      - F49
      security:
      - AdminBearerAuth: []
      responses:
        '200':
          description: 操作成功；领域校验后返回真实结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/QualificationAdminDetail'
                additionalProperties: false
                required:
                - code
                - msg
                - data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: 身份/交易/个人业务响应不缓存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      parameters:
      - in: header
        name: X-Client-Type
        required: true
        schema:
          type: string
          enum:
          - admin
      - in: path
        name: applicationId
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          description: 数据库BIGINT/Java Long；API十进制字符串；服务端还须校验 <=9223372036854775807
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualificationAudit'
      x-permission: biz:driverqualification:audit
      x-authorization:
        realm: ADMIN
        scope: COMPANY_OWNER_DEPT
        permission: biz:driverqualification:audit
        scopeDetails: 读取按提交原公司，当前公司投影另需当前query；审核query/audit覆盖原与当前公司并集，批准再核冻结公司epoch。
        additionalRequiredPermissions:
        - biz:driverqualification:query
      x-error-codes:
      - VI_REQUEST_INVALID
      - VI_AUTH_REQUIRED
      - VI_TOKEN_REALM_MISMATCH
      - VI_REFRESH_REUSED
      - VI_FORBIDDEN
      - VI_SELF_REVIEW_DENIED
      - VI_RESOURCE_NOT_VISIBLE
      - VI_VERSION_CONFLICT
      - VI_STATE_CONFLICT
      - VI_IDEMPOTENCY_CONFLICT
      - VI_SELECTION_CONFLICT
      - VI_CONTEXT_CHANGED
      - VI_SNAPSHOT_CHANGED
      - VI_DATA_INVALID
      - VI_EVIDENCE_INCOMPLETE
      - VI_HANDOVER_CODE_INVALID
      - VI_HANDOVER_LOCKED
      - VI_UNPRICED_LINES
      - VI_REFUND_LIMIT
      - VI_PAYMENT_LIMIT
      - VI_SERVICE_UNAVAILABLE
      - VI_CAPABILITY_NOT_CONFIGURED
      - VI_TRAINING_NOT_READY
      - VI_RATE_LIMITED
      - VI_INTERNAL_ERROR
      - VI_AUTHORITY_UNAVAILABLE
      - VI_UPSTREAM_UNAVAILABLE
      x-error-policy: OBJECT_404_HIDES_EXISTENCE
      x-contract-baseline: V6.4
