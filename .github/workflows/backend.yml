name: backend

on:
  push:
    branches: [master, main, rongli-wx]
    paths:
      - "xinyi-*/**"
      - "pom.xml"
      - "sql/**"
      - "logs/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile all modules
        run: mvn -B -ntp -DskipTests compile

      - name: Package
        run: mvn -B -ntp -DskipTests package

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: xinyi-admin/target/*.jar
          retention-days: 7

  sql-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: xinyi_dev
          MYSQL_DATABASE: xinyi
        ports: ["13307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pxinyi_dev"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Apply migrations twice and assert schema
        env:
          MYSQL_PWD: xinyi_dev
          DB_HOST: 127.0.0.1
          DB_PORT: "13307"
          DB_USER: root
          DB_NAME: xinyi
        run: bash logs/ci_sql_check.sh xinyi

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check (verification scripts)
        run: |
          python -m py_compile logs/*.py
