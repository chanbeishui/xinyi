name: frontend

on:
  push:
    branches: [master, main, rongli-wx]
    paths:
      - "xinyi-ui/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "xinyi-ui/**"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xinyi-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: xinyi-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build:prod

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: xinyi-ui/dist
          retention-days: 7
