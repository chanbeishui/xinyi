name: frontend

on:
  push:
    branches: [master, main, rongli-wx]
    paths:
      - "xinyi-ui/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "xinyi-ui/**"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xinyi-ui
    steps:
      - uses: actions/checkout@v4

      # 前置断言：`npm ci` 与 setup-node 的 cache 都依赖锁文件。
      # 若 package-lock.json 又被加进 .gitignore，这里会给出可执行的原因，
      # 而不是让人对着 setup-node 的 "Dependencies lock file is not found" 猜。
      - name: Verify lock file is committed
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error file=xinyi-ui/.gitignore::xinyi-ui/package-lock.json 未入库。CI 使用 npm ci 安装，缺锁文件必然失败；请勿把 package-lock.json 加入 .gitignore，并在本地执行 npm install 生成后提交。"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: xinyi-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build:prod

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: xinyi-ui/dist
          retention-days: 7
