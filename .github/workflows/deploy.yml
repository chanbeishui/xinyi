name: deploy

# 生产部署流水线
#   1) 手动触发（推荐）：Actions → deploy → Run workflow，可选 all/backend/frontend
#   2) 打 tag 自动触发：git tag v1.2.3 && git push origin v1.2.3
#
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   DEPLOY_HOST     服务器 IP 或域名
#   DEPLOY_USER     部署用户（建议 root 或具备 systemctl 权限的账号）
#   DEPLOY_SSH_KEY  部署用私钥（ed25519，公钥已写入服务器 authorized_keys）
#   DEPLOY_PORT     SSH 端口，可选，默认 22
# 需要的 Variables（可选，覆盖默认路径）：
#   DEPLOY_APP_DIR  默认 /home/xinyi/app
#   DEPLOY_WEB_DIR  默认 /home/xinyi/web
#
# 建议在 Settings → Environments 建 production 环境并开启 Required reviewers，
# 这样点下 Run workflow 后仍需人工批准，避免误发。

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "部署范围（手动触发默认只发前端；发后端用本机 deploy.sh，或勾选 allow_backend / 用 tag 发布）"
        type: choice
        options: [frontend, backend, all]
        default: frontend
      ref:
        description: "分支 / tag / commit SHA（留空 = 当前提交）"
        required: false
      allow_backend:
        description: "允许手动触发时发布后端（jar 跨境传输慢，确认再勾）"
        type: boolean
        default: false
      skip_tests:
        description: "跳过后端单元测试（仅在紧急修复时勾选）"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# 部署必须串行：两个发布同时跑会互相覆盖 jar 与 web 目录
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
  APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/home/xinyi/app' }}
  WEB_DIR: ${{ vars.DEPLOY_WEB_DIR || '/home/xinyi/web' }}
  STAGE_DIR: /tmp/xinyi-deploy
  SERVICE: xinyi-admin

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      scope: ${{ steps.meta.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 校验部署范围
        run: |
          scope="${{ inputs.scope || 'all' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "$scope" != "frontend" ] \
             && [ "${{ inputs.allow_backend }}" != "true" ]; then
            echo "::error::手动触发默认只允许发布前端（4.5MB）。"
            echo "::error::发布后端 jar（94MB）请在本机执行：./deploy/prod/deploy.sh backend"
            echo "::error::如确需在流水线发后端，请勾选 allow_backend，或用 tag 触发（git push origin v1.2.3）。"
            exit 1
          fi
          echo "部署范围：$scope（事件：${{ github.event_name }}）"

      - name: 记录版本信息
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "scope=${{ inputs.scope || 'all' }}" >> "$GITHUB_OUTPUT"
          {
            echo "### 构建信息"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`$(git rev-parse --short HEAD)\` $(git log -1 --pretty=%s) |"
            echo "| 分支/标签 | \`${GITHUB_REF_NAME}\` |"
            echo "| 范围 | ${{ inputs.scope || 'all' }} |"
            echo "| 触发 | ${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        if: ${{ (inputs.scope || 'all') != 'frontend' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 只在真跑测试时执行；紧急修复可用 skip_tests 跳过并自行承担风险
      - name: 后端单元测试
        if: ${{ (inputs.scope || 'all') != 'frontend' && inputs.skip_tests != true }}
        run: mvn -B -ntp -pl xinyi-framework,xinyi-system -am test

      - name: 打包后端
        if: ${{ (inputs.scope || 'all') != 'frontend' }}
        run: mvn -B -ntp -DskipTests package

      - name: 上传 jar
        if: ${{ (inputs.scope || 'all') != 'frontend' }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-jar
          path: xinyi-admin/target/xinyi-admin.jar
          retention-days: 7
          if-no-files-found: error

      - name: Set up Node 20
        if: ${{ (inputs.scope || 'all') != 'backend' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: xinyi-ui/package-lock.json

      - name: 构建前端
        if: ${{ (inputs.scope || 'all') != 'backend' }}
        working-directory: xinyi-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build:prod

      - name: 上传前端产物
        if: ${{ (inputs.scope || 'all') != 'backend' }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dist
          path: xinyi-ui/dist
          retention-days: 7

  deploy:
    name: 发布到生产
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 需在仓库 Settings → Environments 里创建 production 并配置审批人
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 下载 jar
        if: ${{ needs.build.outputs.scope != 'frontend' }}
        uses: actions/download-artifact@v4
        with:
          name: deploy-jar
          path: deploy-artifacts

      - name: 下载前端产物
        if: ${{ needs.build.outputs.scope != 'backend' }}
        uses: actions/download-artifact@v4
        with:
          name: deploy-dist
          path: deploy-artifacts/dist

      - name: 规整部署参数
        run: |
          # Secret 里粘进空格或换行会让 scp 把远端目标当成本地路径（stat local 报错）
          host=$(printf '%s' "${DEPLOY_HOST:-}" | tr -d '[:space:]')
          user=$(printf '%s' "${DEPLOY_USER:-root}" | tr -d '[:space:]')
          port=$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '[:space:]')
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$user" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$port" >> "$GITHUB_ENV"
          echo "host长度=${#host} / user=$user / port=$port"
          if [ -z "$host" ]; then
            echo "::error::DEPLOY_HOST 为空，请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi

      - name: 配置 SSH
        run: |
          install -m 700 -d ~/.ssh

          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::error::DEPLOY_HOST 未配置。Settings → Secrets and variables → Actions 里添加，值只填 IP 或域名（不要带 root@）。"
            exit 1
          fi

          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 私钥格式自检：格式不对会在这里直接暴露，而不是等到 ssh 阶段报 publickey
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>/tmp/keyerr; then
            echo "::error::DEPLOY_SSH_KEY 不是有效私钥（$(head -1 /tmp/keyerr)）。"
            echo "::error::请粘贴 id_ed25519 全文，含首尾 ----- 行，末尾保留一个换行；不要用 .pub。"
            exit 1
          fi
          echo "私钥格式校验通过"

          # keyscan 失败常见于 22 端口未对公网开放。这里降级为首次连接自动信任，
          # 只在本次 Action 的临时容器里生效，不影响宿主安全。
          if ! ssh-keyscan -T 10 -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/kscan; then
            echo "::warning::ssh-keyscan 失败，改用宽松主机校验：$(tr '\n' ' ' < /tmp/kscan | head -c 200)"
            printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' >> ~/.ssh/config
            chmod 600 ~/.ssh/config
          fi

      - name: 上传产物到暂存目录
        run: |
          # 关键：ssh 用 -p 指定端口，scp 用 -P。共用同一份参数会把端口号
          # 当成待拷贝的本地文件，报 scp: stat local "22": No such file
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -p $DEPLOY_PORT -o ConnectTimeout=15 -o BatchMode=yes"
          SCP_OPTS="-i $HOME/.ssh/id_ed25519 -P $DEPLOY_PORT -o ConnectTimeout=15 -o BatchMode=yes"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          ssh $SSH_OPTS "$TARGET" "mkdir -p $STAGE_DIR"

          if [ "${{ needs.build.outputs.scope }}" != "frontend" ]; then
            echo "上传 jar"
            scp $SCP_OPTS deploy-artifacts/xinyi-admin.jar "$TARGET:$STAGE_DIR/"
          fi

          if [ "${{ needs.build.outputs.scope }}" != "backend" ]; then
            echo "上传 dist"
            tar -czf /tmp/dist.tar.gz -C deploy-artifacts/dist .
            scp $SCP_OPTS /tmp/dist.tar.gz "$TARGET:$STAGE_DIR/"
          fi

          ssh $SSH_OPTS "$TARGET" "ls -lh $STAGE_DIR"

      - name: 执行原子部署（健康检查失败自动回滚）
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p $DEPLOY_PORT -o ConnectTimeout=15"
          DO_BACKEND=0; DO_FRONTEND=0
          [ "${{ needs.build.outputs.scope }}" != "frontend" ] && DO_BACKEND=1
          [ "${{ needs.build.outputs.scope }}" != "backend" ]  && DO_FRONTEND=1
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "STAGE_DIR=$STAGE_DIR APP_DIR=$APP_DIR WEB_DIR=$WEB_DIR SERVICE=$SERVICE \
             DO_BACKEND=$DO_BACKEND DO_FRONTEND=$DO_FRONTEND \
             GIT_SHA=${{ needs.build.outputs.sha }} GIT_REF=${GITHUB_REF_NAME} \
             OPERATOR=github-actions/${GITHUB_ACTOR} bash -s" \
            < deploy/prod/remote-deploy.sh

      - name: 部署摘要
        if: always()
        run: |
          {
            echo "### 部署结果：${{ job.status }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`${{ needs.build.outputs.sha }}\` |"
            echo "| 范围 | ${{ needs.build.outputs.scope }} |"
            echo "| 回滚方式 | 后端 \`mv xinyi-admin.jar.prev xinyi-admin.jar\`；前端 \`mv $WEB_DIR.old $WEB_DIR\` |"
          } >> "$GITHUB_STEP_SUMMARY"
