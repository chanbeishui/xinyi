# =====================================================================
# 站点配置（HTTPS 版）——域名备案通过后，用它替换 nginx-xinyi.conf
#
# 为什么必须有这一份：
#   微信小程序（含体验版）对 wx.request 的硬性要求是
#   HTTPS + 已备案域名 + 443 端口 + 后台登记 request 合法域名。
#   备案未完成前，临时站点（IP + 8081 + HTTP）在真机上必然报"网络异常"。
#
# 使用步骤：
#   1. 域名 A 记录解析到服务器公网 IP
#   2. 申请证书（阿里云数字证书服务免费 DV，或 certbot）
#      上传到 /home/xinyi/certs/<域名>.pem 与 <域名>.key，权限 600
#   3. 替换 1panel 站点配置：
#      /opt/1panel/apps/openresty/openresty/conf/conf.d/<站点名>.conf
#   4. 重载：openresty -t && openresty -s reload
#   5. 小程序后台「开发管理 → 开发设置 → 服务器域名」登记 https://<域名>
#   6. 小程序 .env 改成 VITE_API_BASE=https://<域名>/prod-api，重新 release:mp
# =====================================================================

# 80 端口只做两件事：放行证书校验路径，其余 301 到 HTTPS
server {
    listen 80;
    server_name example.com;

    # certbot HTTP-01 校验；用阿里云证书可删除本段
    location /.well-known/acme-challenge/ {
        root /home/xinyi/web;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # openresty >= 1.25.1 可改为：listen 443 ssl; + http2 on;
    server_name example.com;

    ssl_certificate     /home/xinyi/certs/example.com.pem;
    ssl_certificate_key /home/xinyi/certs/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /home/xinyi/web;
    index index.html;

    # 与后端 spring.servlet.multipart.max-request-size(20MB) 对齐
    client_max_body_size 20m;

    access_log /opt/1panel/apps/openresty/openresty/log/access/xinyi.log;
    error_log  /opt/1panel/apps/openresty/openresty/log/error/xinyi.log;

    # Vue history 路由回退：刷新非首页不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后用户立刻拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端接口：尾斜杠会把 /prod-api 前缀剥掉。
    # 小程序请求 ${API_BASE}/api/... → https://<域名>/prod-api/api/... → 后端 /api/...
    location /prod-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 生产屏蔽运维入口（即使后端已关，双保险）
    location ~ ^/(druid|swagger-ui|v3/api-docs) {
        return 404;
    }

    # 隐藏文件不给访问
    location ~ /\.(git|env|htaccess) {
        return 404;
    }
}
