# =====================================================================
# 备案期临时站点配置（无域名，IP + 8081 访问）
#
# 用途：域名 ICP 备案未下时，境内服务器 80/443 被拦截，用非标端口先跑起来。
# 备案通过后整份替换为 nginx-xinyi.conf，并停用本配置。
#
# 前提：
#   1) 阿里云控制台防火墙放行 8081（来源建议限制为办公网出口 IP）
#   2) 1Panel 防火墙同样放行 8081
#
# 安全提醒：这是公网明文 HTTP 入口，务必开启下面的 basic auth 与来源限制，
#          只用于内部验收，不要录入真实业务数据。
# =====================================================================

server {
    listen 8081;
    server_name _;

    root /home/xinyi/web;
    index index.html;

    client_max_body_size 20m;

    access_log /opt/1panel/apps/openresty/openresty/log/access/xinyi-temp.log;
    error_log  /opt/1panel/apps/openresty/openresty/log/error/xinyi-temp.log;

    # --- 入口保护：二选一或同时开启 ---
    # 1) 来源 IP 白名单（把办公网/家庭宽带出口 IP 填进来）
    # allow 1.2.3.4;
    # allow 5.6.7.8;
    # deny all;

    # 2) 基础认证（生成方式见 go-live-runbook.md 第 5 节）
    # auth_basic "xinyi temp";
    # auth_basic_user_file /home/xinyi/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- 反向隧道通道（可选）：把本机开发中的后端挂到公网 ---
    # 本机执行： ssh -R 18080:127.0.0.1:8080 root@服务器IP -N
    # 然后放开下面这段，小程序/手机即可访问 http://公网IP:8081/dev-api/api/...
    # 关闭隧道后记得注释回去，避免 502。
    # location /dev-api/ {
    #     proxy_pass http://127.0.0.1:18080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_read_timeout 120s;
    #     proxy_buffering off;
    # }

    # 后端接口：尾斜杠剥掉 /prod-api 前缀
    # 小程序 VITE_API_BASE 要写 http://公网IP:8081/prod-api
    location /prod-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 生产屏蔽运维入口
    location ~ ^/(druid|swagger-ui|v3/api-docs) {
        return 404;
    }

    location ~ /\.(git|env|htaccess) {
        return 404;
    }
}
