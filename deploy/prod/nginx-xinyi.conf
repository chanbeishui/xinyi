# =====================================================================
# 站点配置（1panel → 网站 → 静态网站 创建后替换站点配置文件）
#
# 文件位置（1panel 默认）：
#   /opt/1panel/apps/openresty/openresty/conf/conf.d/<站点名>.conf
#
# ⚠️ 不要只用面板「反向代理」界面的默认配置：
#   面板默认是 proxy_pass 原样透传，/prod-api/login 会打到后端 /prod-api/login → 404。
#   必须像下面这样带尾斜杠（或写 rewrite 去掉前缀）。
#
# 前端生产环境 VITE_APP_BASE_API = '/prod-api'，与这里的 location 前缀必须一致。
# =====================================================================

server {
    listen 80;
    # 换成你的域名；没有域名先用服务器公网 IP
    server_name example.com;

    root /home/xinyi/web;
    index index.html;

    # 与后端 spring.servlet.multipart.max-request-size(20MB) 对齐
    client_max_body_size 20m;

    access_log /opt/1panel/apps/openresty/openresty/log/access/xinyi.log;
    error_log  /opt/1panel/apps/openresty/openresty/log/error/xinyi.log;

    # Vue history 路由回退：刷新非首页不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后用户立刻拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端接口：尾斜杠会把 /prod-api 前缀剥掉
    location /prod-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 导出报表、批量操作可能较慢
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 生产屏蔽运维入口（即使后端已关，双保险）
    location ~ ^/(druid|swagger-ui|v3/api-docs) {
        return 404;
    }

    # 隐藏文件不给访问
    location ~ /\.(git|env|htaccess) {
        return 404;
    }
}
